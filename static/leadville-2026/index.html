<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Leadville Trail 100 Run — the official 2026 course on 3D terrain, all twelve aid-station stops with cutoffs, and the 15.8 miles at the end of the race with no aid." />
<title>Leadville Trail 100 Run — 2026 course &amp; crew map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20fill='%230E0E0D'/%3E%3Cpath%20d='M2%2012l4-7%203%204%202-3%203%206z'%20fill='%23C9A227'/%3E%3C/svg%3E" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.7.3/maplibre-gl.min.css" rel="stylesheet" />
<style>
  :root {
    --gold: #C9A227;
    --silver: #C7C8CA;
    --ink: #F2EFE7;
    --paper: #0E0E0D;
    --surface: #17171A;
    --raised: #202024;
    --muted: rgba(242, 239, 231, 0.62);
    --faint: rgba(242, 239, 231, 0.42);
    --hairline: rgba(242, 239, 231, 0.13);
    --tap: 44px;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --head-h: 58px;
    --prof-h: 132px;
    --tabs-h: 58px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; }

  .cc-app {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---- header ---- */
  .cc-head {
    flex: none; min-height: var(--head-h);
    display: flex; align-items: center; gap: 12px;
    padding: 9px 14px calc(9px) 14px;
    padding-top: calc(9px + env(safe-area-inset-top));
    background: var(--paper); border-bottom: 1px solid var(--hairline);
  }
  .cc-eyebrow {
    margin: 0 0 2px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold);
  }
  .cc-title {
    margin: 0; font-size: 17px; font-weight: 800; line-height: 1.1;
    letter-spacing: -0.01em; text-transform: uppercase;
  }
  .cc-when {
    flex: none; text-align: right; font-size: 11px; line-height: 1.35;
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .cc-when b { display: block; color: var(--ink); font-size: 12.5px; font-weight: 700; }

  /* ---- map ---- */
  .cc-map-wrap { position: relative; flex: 1 1 auto; min-height: 140px; }
  #map { position: absolute; inset: 0; }

  /* One row, not a stack: two 44 px buttons stacked take 106 px off the top of
     the map, which is where this course's northern end and its labels live. */
  .cc-map-ctl {
    position: absolute; top: 10px; left: 10px; z-index: 3;
    display: flex; align-items: center; gap: 8px;
  }
  .cc-mbtn {
    min-height: var(--tap); min-width: var(--tap);
    display: inline-flex; align-items: center; gap: 8px;
    padding: 0 14px; border-radius: 10px; cursor: pointer;
    background: rgba(14, 14, 13, 0.86); color: var(--ink);
    border: 1px solid var(--hairline);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    font-size: 13px; font-weight: 600; letter-spacing: 0.01em; text-align: left;
  }
  .cc-mbtn .cc-swatch {
    width: 18px; height: 0; flex: none;
    border-top: 2px dashed var(--silver); opacity: 0.7;
  }
  .cc-mbtn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .cc-mbtn[aria-pressed="true"] .cc-swatch { border-top-color: var(--gold); opacity: 1; }
  .cc-mbtn--icon { padding: 0; justify-content: center; }
  .cc-mbtn--icon svg { width: 19px; height: 19px; }

  .cc-gapflag {
    position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 3;
    min-height: var(--tap); display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; cursor: pointer; text-align: left;
    border-radius: 10px; border: 1px solid rgba(201, 162, 39, 0.55);
    background: rgba(28, 22, 6, 0.92);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .cc-gapflag .cc-gapnum {
    flex: none; font-size: 17px; font-weight: 800; color: var(--gold);
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap;
  }
  .cc-gapflag .cc-gaptxt { font-size: 12px; line-height: 1.3; color: var(--ink); }
  .cc-gapflag .cc-gaptxt b { color: var(--gold); font-weight: 700; }

  /* On a phone the zoom stack is redundant — pinch and drag already do it — and
     it sits exactly where this course's finish label wants to be. MapLibre has
     no idea DOM chrome is there, so it happily places a label underneath. */
  @media (max-width: 899px) {
    .maplibregl-ctrl-top-right { display: none; }
  }
  /* MapLibre's own controls ship at 29px — too small for a thumb. */
  .maplibregl-ctrl-group button {
    width: var(--tap); height: var(--tap);
  }
  .maplibregl-ctrl-group { background: rgba(14, 14, 13, 0.86); border: 1px solid var(--hairline); }
  .maplibregl-ctrl-group button span { filter: invert(1); }
  .maplibregl-ctrl-attrib { font-size: 11px; background: rgba(14, 14, 13, 0.7) !important; }
  .maplibregl-ctrl-attrib a { color: var(--faint); }
  .maplibregl-ctrl-attrib-button { width: var(--tap); height: var(--tap); }
  .maplibregl-ctrl-scale {
    background: rgba(14, 14, 13, 0.7); border-color: var(--hairline);
    color: var(--muted); font-size: 11px;
  }

  /* ---- station + cursor markers ---- */
  /* Stations, start/finish and the scrub cursor are MapLibre layers, not HTML
     markers — see the note in crew-console.js. Nothing here styles them. */

  /* ---- profile ---- */
  .cc-profile {
    flex: none; height: var(--prof-h);
    background: var(--surface); border-top: 1px solid var(--hairline);
    display: flex; flex-direction: column;
  }
  .cc-readout {
    flex: none; display: flex; align-items: baseline; gap: 12px;
    padding: 7px 12px 3px; font-variant-numeric: tabular-nums;
  }
  .cc-ro-mile { font-size: 14px; font-weight: 800; letter-spacing: -0.01em; }
  .cc-ro-elev { font-size: 12px; color: var(--gold); font-weight: 700; }
  .cc-ro-next {
    margin-left: auto; font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%;
  }
  /* The canvas is positioned out of flow. Left as a flex item its own
     width/height attributes become its intrinsic size, which feeds back into
     the flex layout and lets the chart grow taller than the strip it sits in. */
  .cc-canvas-wrap { position: relative; flex: 1 1 auto; min-height: 0; }
  #profile {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; cursor: ew-resize; outline: none;
  }
  #profile:focus-visible { box-shadow: inset 0 0 0 2px var(--gold); }

  /* ---- tabs ---- */
  .cc-tabs {
    flex: none; height: var(--tabs-h); display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--paper); border-top: 1px solid var(--hairline);
  }
  .cc-tab {
    min-height: var(--tap); border: 0; background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    border-top: 2px solid transparent; letter-spacing: 0.01em;
    padding: 0 2px; text-align: center; line-height: 1.15;
  }
  .cc-tab.is-on { color: var(--gold); border-top-color: var(--gold); }
  .cc-tab .cc-badge {
    display: inline-block; min-width: 17px; padding: 0 4px; border-radius: 9px;
    background: var(--gold); color: #17140A; font-size: 11px; font-weight: 800;
    line-height: 17px; text-align: center;
  }

  /* ---- sheet ---- */
  .cc-sheet {
    position: absolute; left: 0; right: 0;
    bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom));
    /* Capped so the middle of the map stays uncovered: tapping a station or a
       cue centres it, and the camera cannot be biased away from centre without
       breaking the terrain render (see focusStation in crew-console.js). */
    z-index: 6; max-height: 50%;
    display: flex; flex-direction: column;
    background: var(--surface); border-top: 1px solid var(--hairline);
    box-shadow: 0 -18px 44px rgba(0, 0, 0, 0.6);
  }
  .cc-sheet[hidden] { display: none; }
  .cc-sheet-head {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 10px 8px 10px 16px; border-bottom: 1px solid var(--hairline);
  }
  .cc-sheet-head h2 {
    margin: 0; font-size: 13px; font-weight: 800;
    letter-spacing: 0.09em; text-transform: uppercase; color: var(--gold);
  }
  .cc-sheet-close {
    margin-left: auto; min-height: var(--tap); min-width: var(--tap);
    border: 0; background: none; cursor: pointer; color: var(--muted);
    display: grid; place-items: center;
  }
  .cc-sheet-close svg { width: 18px; height: 18px; }
  .cc-sheet-body {
    flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 4px 0 18px;
  }

  /* ---- aid list ---- */
  .cc-row {
    width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border: 0; border-bottom: 1px solid var(--hairline);
    background: none; text-align: left; cursor: pointer;
  }
  .cc-row:last-child { border-bottom: 0; }
  .cc-row-mile {
    flex: none; width: 46px; text-align: right;
    font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .cc-row-main { flex: 1 1 auto; min-width: 0; }
  .cc-row-name { font-size: 14px; font-weight: 700; line-height: 1.25; }
  .cc-row-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .cc-row-cut {
    flex: none; font-size: 12px; font-weight: 700; color: var(--gold);
    font-variant-numeric: tabular-nums; text-align: right; line-height: 1.25;
  }
  .cc-row-cut span { display: block; font-size: 11px; color: var(--faint); font-weight: 600; }
  .cc-row--crew .cc-row-mile { color: var(--silver); }
  .cc-leg {
    display: inline-block; margin-right: 6px; padding: 1px 5px; border-radius: 3px;
    font-size: 11px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase;
    background: rgba(242, 239, 231, 0.1); color: var(--silver);
  }
  .cc-leg--in { background: rgba(201, 162, 39, 0.16); color: var(--gold); }

  /* ---- turn-by-turn ---- */
  .cc-legs-filter {
    display: flex; gap: 8px; padding: 12px 16px 10px;
    border-bottom: 1px solid var(--hairline);
  }
  .cc-chip {
    flex: 1; min-height: var(--tap); border-radius: 10px; cursor: pointer;
    border: 1px solid var(--hairline); background: var(--raised); color: var(--muted);
    font-size: 13px; font-weight: 700; letter-spacing: 0.01em;
  }
  .cc-chip[aria-pressed="true"] {
    border-color: var(--gold); color: var(--gold); background: rgba(201, 162, 39, 0.1);
  }
  .cc-cue {
    width: 100%; min-height: 54px; display: flex; align-items: center; gap: 11px;
    padding: 9px 16px; border: 0; border-bottom: 1px solid var(--hairline);
    background: none; text-align: left; cursor: pointer;
  }
  .cc-cue:last-child { border-bottom: 0; }
  .cc-cue.is-active { background: rgba(201, 162, 39, 0.12); }
  .cc-cue-mile {
    flex: none; width: 44px; text-align: right; font-size: 13.5px; font-weight: 800;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: var(--muted);
  }
  .cc-cue.is-active .cc-cue-mile { color: var(--gold); }
  .cc-arrow { flex: none; width: 26px; height: 26px; color: var(--silver); }
  .cc-cue.is-active .cc-arrow { color: var(--gold); }
  .cc-cue-text { flex: 1 1 auto; min-width: 0; font-size: 13.5px; line-height: 1.3; }
  .cc-cue-street { font-size: 11px; color: var(--faint); margin-top: 2px; }
  .cc-cue--aid { background: rgba(201, 162, 39, 0.07); }
  .cc-cue--aid .cc-cue-text { font-weight: 700; color: var(--gold); }
  .cc-cue-dot {
    flex: none; width: 24px; height: 24px; display: grid; place-items: center;
  }
  .cc-cue-dot i {
    width: 11px; height: 11px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 0 2px rgba(201, 162, 39, 0.3);
  }
  .cc-cue--crew .cc-cue-dot i { background: transparent; box-shadow: 0 0 0 1.5px var(--silver); }
  .cc-cue--crew .cc-cue-text { color: var(--silver); }

  /* ---- station card ---- */
  .cc-card { padding: 14px 16px 4px; }
  .cc-card h3 { margin: 0 0 3px; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
  .cc-card .cc-note { margin: 0 0 12px; font-size: 12px; color: var(--gold); font-weight: 600; }
  .cc-legs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .cc-leg-box {
    padding: 9px 11px; border-radius: 9px;
    background: var(--raised); border: 1px solid var(--hairline);
  }
  .cc-leg-box .k {
    font-size: 11px; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--faint);
  }
  .cc-leg-box .v {
    font-size: 20px; font-weight: 800; margin-top: 2px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .cc-leg-box .c { font-size: 12px; color: var(--gold); font-weight: 700; margin-top: 3px; }
  .cc-leg-box .c em { font-style: normal; color: var(--faint); font-weight: 600; }
  .cc-access { display: grid; gap: 6px; margin-bottom: 12px; }
  .cc-acc {
    display: flex; align-items: center; gap: 9px; font-size: 13px;
    padding: 7px 10px; border-radius: 8px; background: var(--raised);
  }
  .cc-acc-mark {
    width: 20px; height: 20px; flex: none; border-radius: 50%;
    display: grid; place-items: center; font-size: 12px; font-weight: 800;
  }
  .cc-acc--yes .cc-acc-mark { background: rgba(201, 162, 39, 0.22); color: var(--gold); }
  .cc-acc--no .cc-acc-mark { background: rgba(242, 239, 231, 0.08); color: var(--faint); }
  .cc-acc--no { color: var(--muted); }
  .cc-acc-val { margin-left: auto; font-size: 12px; font-weight: 700; }
  .cc-acc--yes .cc-acc-val { color: var(--gold); }
  .cc-acc--no .cc-acc-val { color: var(--faint); }
  .cc-detail {
    margin: 0 0 14px; font-size: 13px; line-height: 1.5; color: var(--muted);
  }

  /* ---- prose blocks ---- */
  .cc-block { padding: 14px 16px 6px; }
  .cc-block + .cc-block { border-top: 1px solid var(--hairline); }
  .cc-block h4 {
    margin: 0 0 8px; font-size: 11px; font-weight: 800;
    letter-spacing: 0.11em; text-transform: uppercase; color: var(--silver);
  }
  .cc-lede { margin: 0 0 12px; font-size: 13.5px; line-height: 1.5; color: var(--muted); }
  .cc-hero {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;
  }
  .cc-hero-num {
    font-size: 42px; font-weight: 800; color: var(--gold);
    line-height: 0.9; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
  }
  .cc-hero-unit { font-size: 14px; font-weight: 700; color: var(--gold); }
  .cc-hero-sub { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .cc-body { margin: 0 0 12px; font-family: var(--serif); font-size: 15px; line-height: 1.55; }
  .cc-span {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    padding: 10px 12px; border-radius: 9px; background: var(--raised);
    font-size: 12.5px; font-variant-numeric: tabular-nums;
  }
  .cc-span .cc-span-rule {
    flex: 1 1 auto; min-width: 22px; height: 0;
    border-top: 2px dashed var(--gold); opacity: 0.75;
  }
  .cc-span b { font-weight: 800; min-width: 0; }

  .cc-conflict {
    padding: 12px; border-radius: 10px; margin-bottom: 10px;
    background: var(--raised); border: 1px solid var(--hairline);
  }
  /* The questions are sentence case: .cc-block h4 sets uppercase for section
     labels, and a two-line shouted question is harder to read, not louder. */
  .cc-conflict h4 {
    margin: 0 0 9px; font-size: 14.5px; font-weight: 700; line-height: 1.3;
    letter-spacing: 0; text-transform: none; color: var(--ink);
  }
  .cc-vs { display: grid; gap: 7px; }
  .cc-vs-side { padding: 8px 10px; border-radius: 7px; background: rgba(242, 239, 231, 0.05); }
  .cc-vs-side .val { font-size: 14px; font-weight: 800; color: var(--gold); }
  .cc-vs-side .tab {
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--faint); margin-top: 3px;
  }
  .cc-vs-side .quote {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.45;
    color: var(--muted); margin-top: 5px;
  }
  .cc-vs-or {
    text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--faint);
  }
  .cc-why { margin: 9px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }

  .cc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cc-table th {
    text-align: left; font-size: 11px; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--faint); padding: 0 0 6px;
  }
  .cc-table td {
    padding: 7px 0; border-top: 1px solid var(--hairline);
    font-variant-numeric: tabular-nums;
  }
  .cc-table td:first-child { color: var(--muted); }
  .cc-table td.num { text-align: right; font-weight: 700; }
  .cc-table td.delta-bad { color: var(--gold); font-weight: 800; }
  .cc-strike { color: var(--faint); text-decoration: line-through; }
  .cc-arrow { color: var(--faint); padding: 0 6px; }

  .cc-list { margin: 0 0 12px; padding-left: 18px; }
  .cc-list li { font-size: 13px; line-height: 1.5; color: var(--muted); margin-bottom: 6px; }
  .cc-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .cc-tag {
    padding: 4px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    background: var(--raised); border: 1px solid var(--hairline); color: var(--muted);
  }
  .cc-tag--gone { text-decoration: line-through; color: var(--faint); }
  .cc-tag--new { border-color: rgba(201, 162, 39, 0.5); color: var(--gold); }

  .cc-src {
    display: block; margin: 0 16px 6px; padding: 11px 12px; border-radius: 9px;
    min-height: var(--tap); background: var(--raised); border: 1px solid var(--hairline);
    color: var(--ink); text-decoration: none; font-size: 12.5px; line-height: 1.45;
  }
  .cc-src b { color: var(--gold); }
  .cc-foot {
    padding: 4px 16px 10px; font-size: 11px; line-height: 1.5; color: var(--faint);
  }
  .cc-foot a { color: var(--muted); }

  /* ---- loading + error ---- */
  #loading {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: var(--paper); transition: opacity 0.45s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 38px; height: 38px; border-radius: 50%;
    border: 3px solid rgba(242, 239, 231, 0.16); border-top-color: var(--gold);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-text { font-size: 12.5px; letter-spacing: 0.05em; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

  #error-overlay {
    position: fixed; inset: 0; z-index: 40; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(8, 8, 7, 0.94);
  }
  #error-overlay.show { display: flex; }
  .error-card {
    max-width: 520px; width: 100%; background: #1A1408;
    border: 1px solid rgba(201, 162, 39, 0.5); border-radius: 12px; padding: 20px 22px;
  }
  .error-card h2 { margin: 0 0 6px; font-size: 17px; color: var(--gold); }
  .error-card p { margin: 0 0 12px; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .error-card pre {
    margin: 0; padding: 11px 12px; background: #100D06; border-radius: 7px;
    font-family: var(--mono); font-size: 11.5px; color: #E8CE86;
    white-space: pre-wrap; word-break: break-word; max-height: 36vh; overflow: auto;
  }

  /* ---- desktop: the same page, given room ---- */
  @media (min-width: 900px) {
    .cc-app { display: grid; grid-template-columns: 420px 1fr; grid-template-rows: 1fr; }
    .cc-head { grid-column: 1; grid-row: 1; align-self: start; z-index: 7; }
    .cc-map-wrap { grid-column: 2; grid-row: 1; }
    .cc-profile {
      grid-column: 1; grid-row: 1; align-self: end;
      margin-bottom: var(--tabs-h); border-top: 1px solid var(--hairline);
    }

  <script>
(function () {
"use strict";
// ===== core/geo.js =====
/**
 * geo.js — False Summit Studio shared geometry helpers
 * ----------------------------------------------------------------------------
 * Pure, dependency-free math used across the cinematic-map core. Keeping these
 * in one module means the GPX loader, the line-reveal animator, and the map
 * shell all measure distance and search the cumulative-distance array exactly
 * the same way — no drift between the build-time profile and the runtime camera.
 */

const EARTH_RADIUS_M = 6371000;
const METERS_PER_MILE = 1609.344;

/** Degrees to radians. */
function toRad(deg) {
  return (deg * Math.PI) / 180;
}

/** Clamp a number into [lo, hi]. */
function clamp(value, lo, hi) {
  return Math.max(lo, Math.min(hi, value));
}

/** Great-circle distance in meters between two lat/lon points. */
function haversine(lat1, lon1, lat2, lon2) {
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * EARTH_RADIUS_M * Math.asin(Math.min(1, Math.sqrt(a)));
}

/**
 * Largest index i such that arr[i] <= value. Assumes arr is ascending.
 * Returns 0 if value precedes the array. Used to locate the segment that
 * contains a given distance-along-track.
 */
function lowerBoundIndex(arr, value) {
  let lo = 0;
  let hi = arr.length - 1;
  let ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid] <= value) {
      ans = mid;
      lo = mid + 1;
    } else {
      hi = mid - 1;
    }
  }
  return ans;
}


// ===== core/line-reveal.js =====
/**
 * line-reveal.js — False Summit Studio cinematic course-line styling + reveal
 * ----------------------------------------------------------------------------
 * Encapsulates the most error-prone piece in the FSS map library: rendering and
 * animating a course line with MapLibre's line-gradient. Every gotcha learned
 * the hard way is baked in here so nothing downstream re-debugs it:
 *
 *   - line-gradient stops must be STRICTLY ASCENDING. We verify before every
 *     update and skip (with a console warning) rather than throw, so a single
 *     bad frame never crashes a running animation.
 *   - Progress is clamped to Math.min(0.997, p) so the head stop and the
 *     transparent stop after it never collide with position 1.0 (the "tearing"
 *     artifact at the end of a long line).
 *   - The GeoJSON is held in a closure variable. We NEVER read source._data
 *     (private, may be undefined).
 *   - setData() is called exactly ONCE (in init). Every per-frame update goes
 *     through setPaintProperty('line-gradient', ...) — far cheaper than
 *     re-tessellating a long line on each animation frame.
 *
 * Dependency: MapLibre GL JS v5 (global `maplibregl`), loaded by the caller.
 * A source with lineMetrics:true is required for ['line-progress'] to resolve.
 */


const TRANSPARENT = 'rgba(0,0,0,0)';
const MAX_PROGRESS = 0.997; // clamp ceiling — keeps head + tail stops below 1.0
const ZERO_EPS = 1e-4; // below this, reveal nothing (avoids a 0-position collision)

/** Default FSS "cinematic trail" gradient: cool white head-of-pack to hot red. */
const DEFAULT_GRADIENT = {
  tail: '#FFFFFF',
  mid: '#FFE082',
  leading: '#FF8C42',
  head: '#E63946',
};

/**
 * Build the four-position gradient color object from either a named-position
 * object ({tail, mid, leading, head}) or an ordered 4-color array
 * (the form stored in race configs / fss_palette.json).
 */
function resolveGradient(input) {
  const colors = { ...DEFAULT_GRADIENT };
  if (!input) return colors;
  if (Array.isArray(input)) {
    const keys = ['tail', 'mid', 'leading', 'head'];
    input.slice(0, 4).forEach((c, i) => {
      if (typeof c === 'string') colors[keys[i]] = c;
    });
    return colors;
  }
  for (const key of Object.keys(colors)) {
    if (typeof input[key] === 'string') colors[key] = input[key];
  }
  return colors;
}

function createLineReveal(map, options) {
  const { sourceId, layerId, geojson, trackMiles } = options;
  if (!sourceId || !layerId) {
    throw new Error('createLineReveal: sourceId and layerId are required.');
  }
  if (!geojson) throw new Error('createLineReveal: geojson is required.');
  if (!Array.isArray(trackMiles) || trackMiles.length < 2) {
    throw new Error('createLineReveal: trackMiles must be an array of >= 2 cumulative miles.');
  }

  const lineWidth = options.lineWidth ?? 6;
  const lineCap = options.lineCap ?? 'round';
  const colors = resolveGradient(options.gradient ?? options.gradientStops);

  // GeoJSON held in closure — never read back off the source.
  const data = geojson;
  const coords = flattenCoords(data);
  const totalMiles = trackMiles[trackMiles.length - 1];

  let initialized = false;

  function buildGradientExpr(progress) {
    const p = Math.min(MAX_PROGRESS, progress);

    // Nothing revealed yet: a valid, fully-transparent gradient.
    if (p <= ZERO_EPS) {
      return ['interpolate', ['linear'], ['line-progress'], 0, TRANSPARENT, 1, TRANSPARENT];
    }

    const stops = [
      [0, colors.tail],
      [p * 0.4, colors.mid],
      [p * 0.8, colors.leading],
      [p, colors.head],
      [p + 0.002, TRANSPARENT],
      [1, TRANSPARENT],
    ];

    // Strictly ascending guard — the bug this whole module exists to prevent.
    for (let i = 1; i < stops.length; i++) {
      if (stops[i][0] <= stops[i - 1][0]) {
        console.warn(
          `[line-reveal] non-ascending gradient stops at progress=${progress} ` +
            `(${stops[i - 1][0]} -> ${stops[i][0]}); skipping update.`
        );
        return null;
      }
    }

    const expr = ['interpolate', ['linear'], ['line-progress']];
    for (const [pos, color] of stops) expr.push(pos, color);
    return expr;
  }

  const reveal = {
    /**
     * Add the source and the gradient line layer. Source and layer are handled
     * independently: a caller may pre-create the source (e.g. to share it with a
     * casing layer underneath) — we still add our own layer on top of it. The
     * source MUST have lineMetrics:true for ['line-progress'] to resolve.
     */
    init(beforeId) {
      if (initialized) return reveal;
      if (!map.getSource(sourceId)) {
        map.addSource(sourceId, { type: 'geojson', lineMetrics: true, data });
      }
      if (!map.getLayer(layerId)) {
        map.addLayer(
          {
            id: layerId,
            type: 'line',
            source: sourceId,
            layout: { 'line-cap': lineCap, 'line-join': 'round' },
            paint: {
              'line-width': lineWidth,
              'line-gradient': buildGradientExpr(1), // fully styled by default
            },
          },
          beforeId
        );
      }
      initialized = true;
      return reveal;
    },

    /** Reveal the line up to `progress` in [0,1]. */
    setProgress(progress) {
      if (!map.getLayer(layerId)) return;
      const expr = buildGradientExpr(progress);
      if (!expr) return; // non-ascending guard tripped; skip this frame
      map.setPaintProperty(layerId, 'line-gradient', expr);
    },

    setProgressByMile(mile, totalMilesArg) {
      const denom = totalMilesArg || totalMiles;
      reveal.setProgress(denom > 0 ? mile / denom : 0);
    },

    /** Interpolated [lon,lat] position at a given reveal progress. */
    getCurrentPointAtProgress(progress) {
      const p = Math.max(0, Math.min(1, progress));
      const targetMile = p * totalMiles;

      let i = lowerBoundIndex(trackMiles, targetMile);
      if (i >= coords.length - 1) i = coords.length - 2;
      if (i < 0) i = 0;

      const span = trackMiles[i + 1] - trackMiles[i];
      const t = span > 0 ? (targetMile - trackMiles[i]) / span : 0;
      const [lon0, lat0] = coords[i];
      const [lon1, lat1] = coords[i + 1] || coords[i];

      return {
        lat: lat0 + t * (lat1 - lat0),
        lon: lon0 + t * (lon1 - lon0),
        segmentIndex: i,
        segmentT: t,
      };
    },

    destroy() {
      if (map.getLayer(layerId)) map.removeLayer(layerId);
      if (map.getSource(sourceId)) map.removeSource(sourceId);
      initialized = false;
    },
  };

  return reveal;
}

/** Concatenate LineString / MultiLineString coordinates into one [lon,lat] list. */
function flattenCoords(geojson) {
  const geom = geojson.type === 'Feature' ? geojson.geometry : geojson;
  if (!geom) throw new Error('flattenCoords: geojson has no geometry.');
  if (geom.type === 'LineString') return geom.coordinates.slice();
  if (geom.type === 'MultiLineString') return geom.coordinates.flat();
  if (geom.type === 'FeatureCollection') {
    return geom.features.flatMap((f) => flattenCoords(f));
  }
  throw new Error('flattenCoords: expected LineString or MultiLineString geometry.');
}


// ===== core/terrain.js =====
/**
 * terrain.js — False Summit Studio 3D terrain + hillshade
 * ----------------------------------------------------------------------------
 * Adds a raster-DEM source and turns on MapLibre 3D terrain, plus a hillshade
 * layer for relief shading on the 2D basemap. Entirely driven by the race
 * config's `terrain` block, so a race can point at any DEM tileset without a
 * code change:
 *
 *   terrain: {
 *     tiles:        ['https://.../{z}/{x}/{y}.png'],   // required
 *     encoding:     'terrarium' | 'mapbox',            // default 'terrarium'
 *     tileSize:     256,                               // AWS terrarium uses 256
 *     maxzoom:      15,
 *     exaggeration: 1.2,                               // capped at 1.6 (see note)
 *     hillshade:    true
 *   }
 *
 * Default DEM is the free, no-key AWS "elevation-tiles-prod" terrarium set
 * (tileSize 256, encoding 'terrarium' — not mapbox, not 512).
 *
 * NOTE (occlusion): MapLibre raycasts every HTML Marker against the terrain
 * and dims any it considers "covered" to opacity 0.2. Features that add markers
 * must pass `opacityWhenCovered: '1'`. Exaggeration is capped here so vector
 * basemap labels and markers don't drop behind ridgelines.
 */

const DEFAULT_TERRAIN = {
  tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
  encoding: 'terrarium',
  tileSize: 256,
  maxzoom: 15,
  exaggeration: 1.2,
  hillshade: true,
};

const MAX_EXAGGERATION = 1.6; // above this, labels/markers fall behind terrain

const DEM_SOURCE_ID = 'fss-terrain-dem';
const HILLSHADE_LAYER_ID = 'fss-hillshade';

/**
 * Wire up the DEM source, 3D terrain, and (optionally) hillshade.
 * Returns { sourceId, hillshadeLayerId, exaggeration }.
 */
function enableTerrain(map, terrainConfig = {}) {
  const cfg = { ...DEFAULT_TERRAIN, ...terrainConfig };
  const exaggeration = Math.min(MAX_EXAGGERATION, Math.max(0, cfg.exaggeration));

  if (!map.getSource(DEM_SOURCE_ID)) {
    map.addSource(DEM_SOURCE_ID, {
      type: 'raster-dem',
      tiles: cfg.tiles,
      encoding: cfg.encoding,
      tileSize: cfg.tileSize,
      maxzoom: cfg.maxzoom,
    });
  }

  map.setTerrain({ source: DEM_SOURCE_ID, exaggeration });

  let hillshadeLayerId = null;
  if (cfg.hillshade) {
    hillshadeLayerId = addHillshade(map, cfg);
  }

  return { sourceId: DEM_SOURCE_ID, hillshadeLayerId, exaggeration };
}

/**
 * Add a hillshade layer just above the basemap fills. Reuses the terrain DEM
 * source. Inserted below the first symbol layer so place labels stay legible.
 */
function addHillshade(map, cfg = DEFAULT_TERRAIN) {
  if (map.getLayer(HILLSHADE_LAYER_ID)) return HILLSHADE_LAYER_ID;
  if (!map.getSource(DEM_SOURCE_ID)) return null;

  map.addLayer(
    {
      id: HILLSHADE_LAYER_ID,
      type: 'hillshade',
      source: DEM_SOURCE_ID,
      paint: {
        'hillshade-exaggeration': 0.35,
        'hillshade-shadow-color': '#3d3a33',
        'hillshade-highlight-color': '#ffffff',
        'hillshade-accent-color': '#5a5246',
      },
    },
    firstSymbolLayerId(map)
  );
  return HILLSHADE_LAYER_ID;
}

/** Id of the first symbol layer in the current style, or undefined. */
function firstSymbolLayerId(map) {
  const layers = map.getStyle().layers || [];
  const sym = layers.find((l) => l.type === 'symbol');
  return sym && sym.id;
}


// ===== core/basemap.js =====
/**
 * basemap.js — False Summit Studio basemap style resolver
 * ----------------------------------------------------------------------------
 * Turns a race config's `basemap` block into a value MapLibre's `style` option
 * accepts (a URL string or a full style object).
 *
 *   basemap: { style: 'cinematic' }                     // built-in dark style (default)
 *   basemap: { style: 'liberty' }                       // named OpenFreeMap style
 *   basemap: { style: 'https://.../style.json' }        // explicit style URL
 *   basemap: { style: { version: 8, sources: {...} } }  // inline style object
 *
 * Default is the built-in "cinematic" style: a dark, muted vector basemap built
 * on OpenFreeMap's global, no-key, CORS-enabled OpenMapTiles source. It is kept
 * deliberately minimal so 3D terrain shading and the bright gradient course read
 * clearly — and every layer is hand-authored, so the console stays clean (no
 * third-party style warnings). The FSS self-hosted PMTiles basemap only covers
 * the US northeast, so it is NOT a default — a race outside that footprint would
 * render blank.
 */

const OFM_SOURCE = 'openmaptiles';
const OFM_TILEJSON = 'https://tiles.openfreemap.org/planet';
const OFM_GLYPHS = 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf';
const OFM_SPRITE = 'https://tiles.openfreemap.org/sprites/ofm_f384/ofm';

const OPENFREEMAP_STYLES = {
  liberty: 'https://tiles.openfreemap.org/styles/liberty',
  bright: 'https://tiles.openfreemap.org/styles/bright',
  positron: 'https://tiles.openfreemap.org/styles/positron',
  dark: 'https://tiles.openfreemap.org/styles/dark',
};

/** Cinematic dark palette — terrain- and course-forward. */
const CINEMATIC = {
  bg: '#0A0F1E',
  wood: '#11212a',
  scrub: '#15242a',
  park: '#12232b',
  water: '#0b2233',
  roadMajor: '#3a4252',
  roadMinor: '#2a313e',
  boundary: 'rgba(245,240,230,0.16)',
  label: '#F5F0E6',
  labelMuted: 'rgba(245,240,230,0.72)',
  halo: 'rgba(10,15,30,0.92)',
};

/**
 * A hand-authored OpenMapTiles style. Only string `match`/`==` filters and
 * zoom-driven interpolations are used — never a numeric comparison on a property
 * that can be null — so MapLibre never logs a "type number, found null" warning.
 */
function buildCinematicStyle(opts = {}) {
  const c = { ...CINEMATIC };
  if (opts.label) c.label = opts.label;
  const src = OFM_SOURCE;

  return {
    version: 8,
    name: 'FSS Cinematic',
    glyphs: OFM_GLYPHS,
    sprite: OFM_SPRITE,
    sources: { [src]: { type: 'vector', url: OFM_TILEJSON } },
    layers: [
      { id: 'background', type: 'background', paint: { 'background-color': c.bg } },

      {
        id: 'landcover-wood',
        type: 'fill',
        source: src,
        'source-layer': 'landcover',
        filter: ['match', ['get', 'class'], ['wood', 'forest'], true, false],
        paint: { 'fill-color': c.wood, 'fill-opacity': 0.6 },
      },
      {
        id: 'landcover-scrub',
        type: 'fill',
        source: src,
        'source-layer': 'landcover',
        filter: ['match', ['get', 'class'], ['grass', 'scrub', 'heath', 'wetland'], true, false],
        paint: { 'fill-color': c.scrub, 'fill-opacity': 0.45 },
      },
      {
        id: 'park',
        type: 'fill',
        source: src,
        'source-layer': 'park',
        paint: { 'fill-color': c.park, 'fill-opacity': 0.4 },
      },
      {
        id: 'water',
        type: 'fill',
        source: src,
        'source-layer': 'water',
        paint: { 'fill-color': c.water },
      },
      {
        id: 'waterway',
        type: 'line',
        source: src,
        'source-layer': 'waterway',
        paint: {
          'line-color': c.water,
          'line-width': ['interpolate', ['linear'], ['zoom'], 8, 0.5, 14, 2],
        },
      },

      {
        id: 'road-major',
        type: 'line',
        source: src,
        'source-layer': 'transportation',
        filter: ['match', ['get', 'class'], ['motorway', 'trunk', 'primary'], true, false],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': c.roadMajor,
          'line-width': ['interpolate', ['linear'], ['zoom'], 8, 0.6, 12, 1.6, 16, 4],
        },
      },
      {
        id: 'road-minor',
        type: 'line',
        source: src,
        'source-layer': 'transportation',
        minzoom: 11,
        filter: ['match', ['get', 'class'], ['secondary', 'tertiary', 'minor'], true, false],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: {
          'line-color': c.roadMinor,
          'line-width': ['interpolate', ['linear'], ['zoom'], 11, 0.4, 16, 2],
        },
      },

      {
        id: 'boundary-admin',
        type: 'line',
        source: src,
        'source-layer': 'boundary',
        filter: [
          'all',
          ['any', ['==', ['get', 'admin_level'], 2], ['==', ['get', 'admin_level'], 4]],
          ['!=', ['get', 'maritime'], 1],
        ],
        paint: { 'line-color': c.boundary, 'line-dasharray': [2, 2], 'line-width': 0.8 },
      },

      // --- symbol layers: hillshade inserts below the first of these ---
      {
        id: 'place-town',
        type: 'symbol',
        source: src,
        'source-layer': 'place',
        filter: ['match', ['get', 'class'], ['city', 'town'], true, false],
        layout: {
          'text-field': ['coalesce', ['get', 'name:en'], ['get', 'name']],
          'text-font': ['Noto Sans Bold'],
          'text-size': ['interpolate', ['linear'], ['zoom'], 8, 10, 13, 15],
          'text-max-width': 8,
        },
        paint: { 'text-color': c.label, 'text-halo-color': c.halo, 'text-halo-width': 1.4 },
      },
      {
        id: 'place-village',
        type: 'symbol',
        source: src,
        'source-layer': 'place',
        minzoom: 12,
        filter: ['match', ['get', 'class'], ['village', 'hamlet', 'suburb', 'neighbourhood'], true, false],
        layout: {
          'text-field': ['coalesce', ['get', 'name:en'], ['get', 'name']],
          'text-font': ['Noto Sans Regular'],
          'text-size': ['interpolate', ['linear'], ['zoom'], 12, 10, 15, 13],
          'text-max-width': 8,
        },
        paint: { 'text-color': c.labelMuted, 'text-halo-color': c.halo, 'text-halo-width': 1.2 },
      },
    ],
  };
}

const DEFAULT_BASEMAP_STYLE = 'cinematic';

/**
 * Resolve config.basemap into a MapLibre `style` value.
 * Returns a string URL or a style object.
 */
function resolveBasemapStyle(basemapConfig) {
  const style = (basemapConfig && basemapConfig.style) || DEFAULT_BASEMAP_STYLE;

  // Inline style object — pass through untouched.
  if (style && typeof style === 'object') return style;

  if (style === 'cinematic') {
    return buildCinematicStyle({ label: basemapConfig && basemapConfig.label });
  }
  if (OPENFREEMAP_STYLES[style]) return OPENFREEMAP_STYLES[style];
  return style; // a literal URL
}


// ===== core/map-shell.js =====
/**
 * map-shell.js — False Summit Studio reusable cinematic map shell
 * ----------------------------------------------------------------------------
 * The single entry point every feature builds on. Given a race config and the
 * pre-baked course/profile data (produced by core/pipeline/gpx_to_course.py),
 * it constructs a MapLibre GL JS v5 map with 3D terrain, hillshade relief, and
 * the FSS cinematic gradient course line — then hands back the live map plus a
 * small handle so features can layer on aid stations, fly-throughs, etc.
 *
 *   import { createRaceMap } from '../core/map-shell.js';
 *   const race = await createRaceMap({ container: 'map', config, course, profile });
 *   race.map   // the maplibregl.Map, terrain already enabled
 *   race.reveal.setProgress(0.5)   // animate the course line
 *
 * The shell does NOT fetch anything itself — the caller supplies config/course/
 * profile as parsed objects. This keeps it pure and testable, and lets the demo
 * build inline all data so the page opens straight from disk (file://) with no
 * cross-origin fetch.
 *
 * Dependency: MapLibre GL JS v5 on `window.maplibregl`.
 */


const COURSE_SOURCE_ID = 'fss-course';
const COURSE_LAYER_ID = 'fss-course-line';
const COURSE_CASING_ID = 'fss-course-casing';

/**
 * Create a cinematic race map.
 *
 * @param {Object}  o
 * @param {string|HTMLElement} o.container   map container id or element
 * @param {Object}  o.config                 race config (see race-config.schema.json)
 * @param {Object}  o.course                 course GeoJSON (Feature / FeatureCollection)
 * @param {Object} [o.profile]               per-mile profile (optional, attached to handle)
 * @param {Function} [o.onReady]             called with the handle once terrain + course load
 * @param {Function} [o.onError]             called with any error (also rejects the promise)
 * @param {boolean} [o.revealProgress=1]     initial course reveal (1 = fully styled)
 * @returns {Promise<{map, reveal, course, profile, config, trackMiles, totalMiles}>}
 */
function createRaceMap(o) {
  return new Promise((resolve, reject) => {
    const { container, config, course } = o;
    const profile = o.profile ?? null;
    const onReady = o.onReady ?? (() => {});
    const onError = o.onError ?? (() => {});
    const initialReveal = o.revealProgress ?? 1;

    const fail = (err) => {
      const e = err instanceof Error ? err : new Error(String(err));
      onError(e);
      reject(e);
    };

    if (typeof window === 'undefined' || !window.maplibregl) {
      return fail(new Error('createRaceMap: window.maplibregl (MapLibre GL JS v5) is not loaded.'));
    }
    if (!config) return fail(new Error('createRaceMap: config is required.'));
    if (!course) return fail(new Error('createRaceMap: course GeoJSON is required.'));

    const maplibregl = window.maplibregl;
    const view = config.view || {};

    // Flatten the course into one ordered coordinate list and derive the
    // cumulative-miles axis the reveal uses — computed from the exact geometry
    // we are about to draw so the two never drift.
    const coords = extractCoords(course);
    if (coords.length < 2) {
      return fail(new Error('createRaceMap: course must contain at least 2 coordinates.'));
    }
    const trackMiles = cumulativeMiles(coords);
    const totalMiles = trackMiles[trackMiles.length - 1];

    let map;
    try {
      map = new maplibregl.Map({
        container,
        style: resolveBasemapStyle(config.basemap),
        center: view.center ?? coords[Math.floor(coords.length / 2)],
        zoom: view.zoom ?? 12,
        pitch: view.pitch ?? 60,
        bearing: view.bearing ?? 0,
        maxPitch: 85,
        antialias: true,
        attributionControl: { compact: true },
      });
    } catch (err) {
      return fail(err);
    }

    // Surface async style/tile errors to the caller's overlay rather than
    // letting them disappear into the console.
    map.on('error', (e) => onError(e && e.error ? e.error : new Error('MapLibre error event')));

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }), 'bottom-left');

    map.on('load', () => {
      try {
        // 1) 3D terrain + hillshade relief.
        enableTerrain(map, config.terrain);

        // 2) A dark casing under the gradient line for contrast on bright terrain.
        map.addSource(COURSE_SOURCE_ID, {
          type: 'geojson',
          lineMetrics: true,
          data: course,
        });
        map.addLayer({
          id: COURSE_CASING_ID,
          type: 'line',
          source: COURSE_SOURCE_ID,
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: {
            'line-color': '#11131a',
            'line-width': (config.course && config.course.width ? config.course.width : 6) + 4,
            'line-opacity': 0.55,
            'line-blur': 0.5,
          },
        });

        // 3) The FSS cinematic gradient course line, drawn on top of the casing.
        //    Reuses our own source so the reveal does not add a duplicate.
        const reveal = createLineReveal(map, {
          sourceId: COURSE_SOURCE_ID,
          layerId: COURSE_LAYER_ID,
          geojson: course,
          trackMiles,
          gradient: config.course && config.course.gradient,
          lineWidth: config.course && config.course.width ? config.course.width : 6,
        });
        reveal.init();
        reveal.setProgress(clamp(initialReveal, 0, 1));

        // 4) Cinematic camera: ease into the configured hero framing.
        if (view.bounds && !view.center) {
          map.fitBounds(view.bounds, { padding: 60, pitch: view.pitch ?? 60, duration: 0 });
        }

        const handle = { map, reveal, course, profile, config, trackMiles, totalMiles };
        onReady(handle);
        resolve(handle);
      } catch (err) {
        fail(err);
      }
    });
  });
}

/** Extract a flat [lon,lat] (+optional ele) list from any course GeoJSON shape. */
function extractCoords(course) {
  const out = [];
  const pushGeom = (geom) => {
    if (!geom) return;
    if (geom.type === 'LineString') out.push(...geom.coordinates);
    else if (geom.type === 'MultiLineString') geom.coordinates.forEach((c) => out.push(...c));
  };
  if (course.type === 'FeatureCollection') {
    course.features.forEach((f) => pushGeom(f.geometry));
  } else if (course.type === 'Feature') {
    pushGeom(course.geometry);
  } else {
    pushGeom(course);
  }
  return out;
}

/** Cumulative miles at each coordinate of a flattened [lon,lat] list. */
function cumulativeMiles(coords) {
  const miles = new Array(coords.length);
  miles[0] = 0;
  for (let i = 1; i < coords.length; i++) {
    const [lon0, lat0] = coords[i - 1];
    const [lon1, lat1] = coords[i];
    miles[i] = miles[i - 1] + haversine(lat0, lon0, lat1, lon1) / METERS_PER_MILE;
  }
  return miles;
}


// ===== features/crew-console/crew-console.js =====
/**
 * crew-console.js — False Summit Studio crew console (Leadville Trail 100 Run)
 * ----------------------------------------------------------------------------
 * A mobile-first operations layer on top of core/map-shell.js. Built for the
 * person this map is actually for: a crew member on a phone in a dirt parking
 * lot with one bar of signal, at 2 a.m.
 *
 * What it adds to the shell's 3D-terrain map:
 *
 *   - the classic course as a toggleable ghost underneath the current route,
 *     so a returning runner sees exactly what was swapped;
 *   - the unsupported stretch at the end of the race as its own labelled
 *     segment — the single most useful thing on this map;
 *   - one tappable marker per aid location, each carrying every stop it serves
 *     (outbound mile, inbound mile, both cutoffs, crew / drop-bag / pacer-bib);
 *   - the official cue sheet as tappable turn badges, each lighting the
 *     stretch of course its instruction applies to;
 *   - a scrubable elevation profile wired to a cursor marker on the map.
 *
 * On an out-and-back the outbound and inbound stops at a location are the same
 * coordinate, so the map carries one point per location and its card holds both
 * legs. Every individual stop still gets a tick on the profile and a row in the
 * list, so nothing is lost — see stopRows().
 *
 * Everything is driven by data. No geometry, mileage, cutoff or advisory is
 * computed or invented here; the module only draws what data/<slug>/ carries.
 *
 * Dependencies: MapLibre GL JS v5 on window.maplibregl, and core/geo.js.
 */


const GHOST_SOURCE = 'fss-ghost-course';
const GHOST_LAYER = 'fss-ghost-course-line';
const GAP_SOURCE = 'fss-unsupported-gap';
const GAP_GLOW_LAYER = 'fss-unsupported-gap-glow';
const GAP_LAYER = 'fss-unsupported-gap-line';
const GAP_LABEL_LAYER = 'fss-unsupported-gap-label';

const STATION_SOURCE = 'fss-aid-stations';
const STATION_HIT_LAYER = 'fss-aid-hit';
const STATION_DOT_LAYER = 'fss-aid-dot';
const STATION_LABEL_LAYER = 'fss-aid-label';
const CURSOR_SOURCE = 'fss-scrub-cursor';
const CURSOR_LAYER = 'fss-scrub-cursor-dot';

const TURN_SOURCE = 'fss-turns';
const TURN_HIT_LAYER = 'fss-turn-hit';
const TURN_BADGE_LAYER = 'fss-turn-badge';
const TURN_ACTIVE_SOURCE = 'fss-turn-active';
const TURN_ACTIVE_LAYER = 'fss-turn-active-line';

/** Badge geometry and the angle each manoeuvre points, 0 being straight on. */
const TURN_ICON_PX = 26;
const TURN_ROTATION = {
  straight: 0,
  'slight-right': 42,
  right: 90,
  'sharp-right': 138,
  'slight-left': -42,
  left: -90,
  'sharp-left': -138,
  uturn: 180,
};

// Eighty-seven cues across a hundred miles is texture, not information, until
// there is room for them. Below this zoom the badges stay off entirely.
const TURN_MIN_ZOOM = 11.5;
/** Cap the highlighted stretch so a long straight does not light up the state. */
const ACTIVE_MAX_MI = 3;

/** Half of the 44 px minimum tap target, as a circle radius. */
const TAP_RADIUS_PX = 22;

// Camera. The overview is gently pitched — a hundred miles of Sawatch seen
// edge-on is unreadable — and the detail views come in closer and steeper.
//
// Do not push past z13.2. Beyond it the camera ends up inside the terrain and
// MapLibre culls the scene: at z13.8/pitch 55 the map renders black with the
// course lines floating on nothing.
//
// The detail pitch was tuned against the headless software rasteriser, which
// drops different layers at different pitches depending on how steep the ground
// under the camera is — at one cue pitch 40 painted the relief but not the
// course, and pitch 30 lost the aid dots that pitch 55 drew. 55 is the value
// that held up across the most verification runs. If detail views look wrong on
// real hardware, this constant is the first thing to try.
const OVERVIEW_PITCH = 30;
const DETAIL_PITCH = 55;
const DETAIL_ZOOM = 13.2;
/** Cues use the same framing as stations, for the same reason. */
const TURN_ZOOM = DETAIL_ZOOM;
const FLIGHT_MS = 850;

/** Below this width the station card overlays the map instead of sitting beside it. */
const DESKTOP_MIN_PX = 900;

// Room the floating page chrome needs on each edge of the map.
const GAP_FLAG_CLEARANCE_PX = 62;
const CTRL_CLEARANCE_PX = 60;
const ZOOM_CTRL_CLEARANCE_PX = 50;

const CREW_PALETTE = {
  ghost: '#6E6A5E',
  gap: '#C9A227',
  silver: '#C7C8CA',
  cursor: '#F2EFE7',
  ink: '#0E0E0D',
};

/**
 * Slice a flattened coordinate list to the span between two track miles.
 * Endpoints are interpolated so the segment starts and ends exactly on the
 * mileage given rather than snapping to the nearest GPS vertex — the vertices
 * are not evenly spaced, so snapping would move the label by up to 100 m.
 */
function sliceCoordsByMile(coords, trackMiles, fromMile, toMile) {
  const lo = clamp(Math.min(fromMile, toMile), 0, trackMiles[trackMiles.length - 1]);
  const hi = clamp(Math.max(fromMile, toMile), 0, trackMiles[trackMiles.length - 1]);
  const out = [pointAtMile(coords, trackMiles, lo)];
  for (let i = 0; i < coords.length; i++) {
    if (trackMiles[i] > lo && trackMiles[i] < hi) out.push(coords[i].slice(0, 2));
  }
  out.push(pointAtMile(coords, trackMiles, hi));
  return out;
}

/**
 * [lon, lat] at a given track mile. Binary-searches the cumulative-mile array
 * and interpolates within the segment: GPS points are NOT evenly spaced, so
 * indexing by array position instead of mileage would drift by miles on a
 * course this long.
 */
function pointAtMile(coords, trackMiles, mile) {
  const total = trackMiles[trackMiles.length - 1];
  const m = clamp(mile, 0, total);
  let i = lowerBoundIndex(trackMiles, m);
  if (i >= coords.length - 1) i = coords.length - 2;
  if (i < 0) i = 0;
  const span = trackMiles[i + 1] - trackMiles[i];
  const t = span > 0 ? (m - trackMiles[i]) / span : 0;
  const a = coords[i];
  const b = coords[i + 1] || a;
  return [a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])];
}

/** Elevation (ft) at a track mile, read off the profile's charting series. */
function elevationAtMile(series, mile) {
  if (!series || !series.length) return null;
  const xs = series.map((p) => p.distanceMi);
  const m = clamp(mile, xs[0], xs[xs.length - 1]);
  let i = lowerBoundIndex(xs, m);
  if (i >= series.length - 1) i = series.length - 2;
  if (i < 0) i = 0;
  const span = xs[i + 1] - xs[i];
  const t = span > 0 ? (m - xs[i]) / span : 0;
  return series[i].elevationFt + t * (series[i + 1].elevationFt - series[i].elevationFt);
}

/**
 * One row per stop event, in course order, with the fields the list and the
 * profile ticks both need. `aid.stops` already carries this from the build —
 * this reshapes it against the station records so a row can render on its own.
 */
function stopRows(aid) {
  const byId = {};
  (aid.stations || []).forEach((s) => { byId[s.id] = s; });
  return (aid.stops || []).map((stop) => {
    const st = byId[stop.stationId] || {};
    return {
      id: stop.id,
      stationId: stop.stationId,
      name: stop.name,
      leg: stop.leg,
      publishedMile: stop.publishedMile,
      trackMile: stop.trackMile,
      cutoff: stop.cutoff,
      aid: stop.aid,
      crew: !!st.crew,
      dropBag: !!st.dropBag,
      pacerBib: !!st.pacerBib,
      note: st.note || '',
    };
  });
}

/**
 * Build the console. Returns a controller the page wires its DOM to.
 *
 * @param {Object} o
 * @param {Object} o.handle   the createRaceMap() handle (map, trackMiles, totalMiles, ...)
 * @param {Object} o.aid      aid-stations.json
 * @param {Object} o.advisories advisories.json
 * @param {Object} [o.ghost]  classic-course.geojson
 * @param {Object} [o.turns]  turns.json
 * @param {Object} [o.profile] course-profile.json
 */
function createCrewConsole(o) {
  const { handle, aid, advisories } = o;
  const map = handle.map;
  const maplibregl = window.maplibregl;
  const trackMiles = handle.trackMiles;
  const totalMiles = handle.totalMiles;
  const flat = flattenCourseCoords(handle.course);
  const profile = o.profile || handle.profile || null;
  const series = (profile && profile.series) || [];

  const listeners = { mile: [], station: [], turn: [] };
  const turnData = (o.turns && o.turns.turns) || [];
  let cursorMile = 0;
  let ghostOn = false;
  let activeTurnId = null;

  // The gap's published mileage lives in advisories; convert it onto the
  // measured track using the same basis the build used for stop placement.
  const basis = aid.mileBasis || 100;
  const gapFromTrack = (advisories.gap.fromMile / basis) * totalMiles;
  const gapToTrack = totalMiles;

  // ---- map layers -------------------------------------------------------- //

  function addGhost() {
    if (!o.ghost || map.getSource(GHOST_SOURCE)) return;
    map.addSource(GHOST_SOURCE, { type: 'geojson', data: o.ghost });
    map.addLayer(
      {
        id: GHOST_LAYER,
        type: 'line',
        source: GHOST_SOURCE,
        layout: { 'line-cap': 'round', 'line-join': 'round', visibility: 'none' },
        paint: {
          'line-color': CREW_PALETTE.ghost,
          'line-width': ['interpolate', ['linear'], ['zoom'], 8, 2, 13, 4, 16, 6],
          'line-opacity': 0.85,
          'line-dasharray': [1.5, 1.5],
        },
      },
      'fss-course-casing'
    );
  }

  function addGap() {
    if (map.getSource(GAP_SOURCE)) return;
    const gapCoords = sliceCoordsByMile(flat, trackMiles, gapFromTrack, gapToTrack);
    const mid = pointAtMile(flat, trackMiles, (gapFromTrack + gapToTrack) / 2);
    map.addSource(GAP_SOURCE, {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: [
          {
            type: 'Feature',
            properties: { kind: 'line' },
            geometry: { type: 'LineString', coordinates: gapCoords },
          },
          {
            type: 'Feature',
            properties: {
              kind: 'label',
              label: advisories.gap.miles + ' mi · no aid',
            },
            geometry: { type: 'Point', coordinates: mid },
          },
        ],
      },
    });
    map.addLayer({
      id: GAP_GLOW_LAYER,
      type: 'line',
      source: GAP_SOURCE,
      filter: ['==', ['get', 'kind'], 'line'],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': CREW_PALETTE.gap,
        'line-width': ['interpolate', ['linear'], ['zoom'], 8, 8, 13, 16, 16, 22],
        'line-opacity': 0.22,
        'line-blur': 3,
      },
    });
    map.addLayer({
      id: GAP_LAYER,
      type: 'line',
      source: GAP_SOURCE,
      filter: ['==', ['get', 'kind'], 'line'],
      layout: { 'line-cap': 'butt', 'line-join': 'round' },
      paint: {
        'line-color': CREW_PALETTE.gap,
        'line-width': ['interpolate', ['linear'], ['zoom'], 8, 3, 13, 5, 16, 7],
        'line-dasharray': [2.5, 1.6],
      },
    });
    map.addLayer({
      id: GAP_LABEL_LAYER,
      type: 'symbol',
      source: GAP_SOURCE,
      filter: ['==', ['get', 'kind'], 'label'],
      layout: {
        'text-field': ['get', 'label'],
        'text-font': ['Noto Sans Bold'],
        'text-size': ['interpolate', ['linear'], ['zoom'], 8, 11, 13, 14],
        'text-offset': [0, -1.1],
        // The gap is the headline of this map. It always draws; station labels
        // stay in the collision index and move out of its way instead.
        'text-allow-overlap': true,
        'text-ignore-placement': false,
      },
      paint: {
        'text-color': CREW_PALETTE.gap,
        'text-halo-color': 'rgba(14,14,13,0.95)',
        'text-halo-width': 1.8,
      },
    });
  }

  /**
   * Stations, start/finish and the scrub cursor are drawn as MapLibre layers,
   * not HTML markers — and that is a correctness decision, not a style one.
   *
   * With 3D terrain MapLibre lifts an HTML Marker to the terrain height under it
   * but draws line layers on the flat projection. At Leadville that is 3 km of
   * disagreement: measured on this course, an HTML pin for Winfield rendered
   * 308 px below the course line it is supposed to sit on, and the error grew
   * with elevation and with distance down the screen. Drawn as a circle layer
   * the same station lands exactly on the line, because now one renderer places
   * both. It also hands label collision back to MapLibre, which does it properly.
   */
  function stationFeatures() {
    const feats = (aid.stations || []).map((st) => ({
      type: 'Feature',
      properties: {
        id: st.id,
        name: st.name,
        kind: st.aid ? 'aid' : 'crew',
        sort: st.crew ? 1 : 2,
      },
      geometry: { type: 'Point', coordinates: st.coord },
    }));
    feats.push({
      type: 'Feature',
      properties: { id: 'start', name: 'Start / Finish', kind: 'start', sort: 0 },
      geometry: { type: 'Point', coordinates: aid.start.coord },
    });
    return { type: 'FeatureCollection', features: feats };
  }

  function addStations() {
    if (map.getSource(STATION_SOURCE)) return;
    map.addSource(STATION_SOURCE, { type: 'geojson', data: stationFeatures() });

    // An invisible 44 px target under every station. Circle hit-testing uses the
    // rendered radius, so this is a real thumb target and not a decoration.
    map.addLayer({
      id: STATION_HIT_LAYER,
      type: 'circle',
      source: STATION_SOURCE,
      paint: { 'circle-radius': TAP_RADIUS_PX, 'circle-color': CREW_PALETTE.gap, 'circle-opacity': 0 },
    });

    map.addLayer({
      id: STATION_DOT_LAYER,
      type: 'circle',
      source: STATION_SOURCE,
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 9, 5.5, 14, 8],
        'circle-color': [
          'match', ['get', 'kind'],
          'aid', CREW_PALETTE.gap,
          'start', CREW_PALETTE.cursor,
          'rgba(0,0,0,0)',
        ],
        'circle-stroke-width': 2,
        'circle-stroke-color': [
          'match', ['get', 'kind'],
          'crew', CREW_PALETTE.silver,
          CREW_PALETTE.ink,
        ],
      },
    });

    map.addLayer({
      id: STATION_LABEL_LAYER,
      type: 'symbol',
      source: STATION_SOURCE,
      layout: {
        'text-field': ['get', 'name'],
        'text-font': ['Noto Sans Bold'],
        'text-size': ['interpolate', ['linear'], ['zoom'], 9, 11, 14, 13],
        'text-variable-anchor': ['left', 'right', 'top', 'bottom'],
        'text-radial-offset': 0.9,
        'text-justify': 'auto',
        'text-max-width': 9,
        // Start/finish is the one label worth keeping when the whole hundred
        // miles is in frame; the rest earn their place by fitting.
        'symbol-sort-key': ['get', 'sort'],
        'text-optional': true,
      },
      paint: {
        'text-color': ['match', ['get', 'kind'], 'crew', CREW_PALETTE.silver, CREW_PALETTE.cursor],
        'text-halo-color': 'rgba(14,14,13,0.95)',
        'text-halo-width': 1.6,
      },
    });

    // One handler, explicit priority. Two per-layer handlers would both fire
    // where an aid station and a turn cue overlap, opening two panels.
    map.on('click', (e) => {
      const hit = (layer) =>
        map.getLayer(layer) ? map.queryRenderedFeatures(e.point, { layers: [layer] }) : [];
      const station = hit(STATION_HIT_LAYER);
      if (station.length) {
        emit('station', station[0].properties.id);
        return;
      }
      const turn = hit(TURN_HIT_LAYER);
      if (turn.length) emit('turn', turn[0].properties.id);
    });
    map.on('mousemove', (e) => {
      const over = [STATION_HIT_LAYER, TURN_HIT_LAYER].some(
        (l) => map.getLayer(l) && map.queryRenderedFeatures(e.point, { layers: [l] }).length
      );
      map.getCanvas().style.cursor = over ? 'pointer' : '';
    });
  }

  function addCursor() {
    if (map.getSource(CURSOR_SOURCE)) return;
    map.addSource(CURSOR_SOURCE, { type: 'geojson', data: cursorFeature(flat[0]) });
    map.addLayer({
      id: CURSOR_LAYER,
      type: 'circle',
      source: CURSOR_SOURCE,
      paint: {
        'circle-radius': 7,
        'circle-color': CREW_PALETTE.cursor,
        'circle-stroke-width': 3,
        'circle-stroke-color': CREW_PALETTE.ink,
      },
    });
  }

  function cursorFeature(coord) {
    return { type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: coord } };
  }


  // ---- turn-by-turn ------------------------------------------------------ //

  /**
   * Badge images are drawn to a canvas rather than set as text.
   *
   * A glyph like U+21B0 renders as a blank box if the basemap's font stack
   * happens not to serve it, and there is no way to find that out except by
   * looking. A drawn arrow always renders, rotates to any angle, and lets the
   * badge carry the halo it needs to stay readable over a bright course line.
   */
  function turnIcon(kind, ratio) {
    const size = Math.round(TURN_ICON_PX * ratio);
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const g = canvas.getContext('2d');
    g.scale(ratio, ratio);
    const c = TURN_ICON_PX / 2;

    g.beginPath();
    g.arc(c, c, c - 2.5, 0, Math.PI * 2);
    g.fillStyle = 'rgba(14, 14, 13, 0.92)';
    g.fill();
    g.lineWidth = 1.8;
    g.strokeStyle = CREW_PALETTE.silver;
    g.stroke();

    g.save();
    g.translate(c, c);
    g.rotate((TURN_ROTATION[kind] * Math.PI) / 180);
    g.strokeStyle = CREW_PALETTE.cursor;
    g.fillStyle = CREW_PALETTE.cursor;
    g.lineWidth = 1.8;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    if (kind === 'uturn') {
      g.beginPath();
      g.arc(0, 0.5, 3.2, Math.PI, 0);
      g.lineTo(3.2, 3.4);
      g.stroke();
      g.beginPath();
      g.moveTo(3.2, 5.4);
      g.lineTo(1.4, 2.6);
      g.lineTo(5.0, 2.6);
      g.closePath();
      g.fill();
    } else {
      g.beginPath();
      g.moveTo(0, 4.6);
      g.lineTo(0, -1.6);
      g.stroke();
      g.beginPath();
      g.moveTo(0, -5.2);
      g.lineTo(-3.4, -0.9);
      g.lineTo(3.4, -0.9);
      g.closePath();
      g.fill();
    }
    g.restore();

    return { width: size, height: size, data: g.getImageData(0, 0, size, size).data };
  }

  function addTurns() {
    if (!turnData.length || map.getSource(TURN_SOURCE)) return;

    const ratio = Math.min(3, Math.max(1, Math.round(window.devicePixelRatio || 1)));
    Object.keys(TURN_ROTATION).forEach((kind) => {
      const id = 'fss-turn-' + kind;
      if (!map.hasImage(id)) map.addImage(id, turnIcon(kind, ratio), { pixelRatio: ratio });
    });

    map.addSource(TURN_SOURCE, {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: turnData.map((t) => ({
          type: 'Feature',
          properties: { id: t.id, icon: 'fss-turn-' + t.kind, mile: t.mile, leg: t.leg },
          geometry: { type: 'Point', coordinates: t.coord },
        })),
      },
    });

    // The active turn's stretch of course, and a ring under its badge.
    map.addSource(TURN_ACTIVE_SOURCE, { type: 'geojson', data: emptyCollection() });
    map.addLayer({
      id: TURN_ACTIVE_LAYER,
      type: 'line',
      source: TURN_ACTIVE_SOURCE,
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: {
        'line-color': CREW_PALETTE.gap,
        'line-width': ['interpolate', ['linear'], ['zoom'], 10, 5, 15, 9],
        'line-opacity': 0.9,
      },
    });

    map.addLayer({
      id: TURN_HIT_LAYER,
      type: 'circle',
      source: TURN_SOURCE,
      minzoom: TURN_MIN_ZOOM,
      paint: { 'circle-radius': TAP_RADIUS_PX, 'circle-color': CREW_PALETTE.silver, 'circle-opacity': 0 },
    });
    map.addLayer({
      id: TURN_BADGE_LAYER,
      type: 'symbol',
      source: TURN_SOURCE,
      minzoom: TURN_MIN_ZOOM,
      layout: {
        'icon-image': ['get', 'icon'],
        'icon-size': ['interpolate', ['linear'], ['zoom'], TURN_MIN_ZOOM, 0.7, 15, 1],
        'icon-allow-overlap': false,
        'icon-padding': 3,
      },
    });
  }

  function emptyCollection() {
    return { type: 'FeatureCollection', features: [] };
  }

  /**
   * Highlight a turn: light the course from it to the next cue, so the
   * instruction is attached to the ground it applies to rather than to a dot.
   */
  function setActiveTurn(id) {
    activeTurnId = id || null;
    const src = map.getSource(TURN_ACTIVE_SOURCE);
    if (!src) return;
    const i = turnData.findIndex((t) => t.id === activeTurnId);
    if (i < 0) {
      src.setData(emptyCollection());
      return;
    }
    const from = turnData[i].mile;
    const to = i + 1 < turnData.length ? turnData[i + 1].mile : totalMiles;
    src.setData({
      type: 'FeatureCollection',
      features: [{
        type: 'Feature',
        properties: {},
        geometry: {
          type: 'LineString',
          coordinates: sliceCoordsByMile(flat, trackMiles, from, Math.min(to, from + ACTIVE_MAX_MI)),
        },
      }],
    });
  }

  function focusTurn(id) {
    const t = turnData.find((x) => x.id === id);
    if (!t) return;
    setActiveTurn(id);
    map.flyTo({
      center: t.coord,
      zoom: TURN_ZOOM,
      pitch: DETAIL_PITCH,
      duration: FLIGHT_MS,
      essential: true,
    });
    setCursorMile(t.mile);
  }

  // ---- controller -------------------------------------------------------- //

  function emit(name, value) {
    (listeners[name] || []).forEach((fn) => fn(value));
  }

  function setCursorMile(mile) {
    cursorMile = clamp(mile, 0, totalMiles);
    const src = map.getSource(CURSOR_SOURCE);
    if (src) src.setData(cursorFeature(pointAtMile(flat, trackMiles, cursorMile)));
    emit('mile', cursorMile);
  }

  /**
   * Camera framing.
   *
   * Deliberately plain fitBounds / flyTo, after a long detour that is worth
   * recording: on a terrain map `map.project()` cannot be trusted. Measured
   * here, with the camera centred exactly on Twin Lakes, project() reported the
   * station 233 px ABOVE the top of the map while it was in fact drawn within
   * a few pixels of the centre. A correction loop built on that reading pans
   * away from a view that was already correct, and no sign of the correction
   * converges, because it is chasing a number that does not describe anything
   * on screen.
   *
   * What is true: fitBounds and flyTo put the course where it belongs, and
   * everything drawn — course, gap, stations, cursor — is a MapLibre layer, so
   * it all moves together. The only thing framing really needs is padding that
   * accounts for the chrome floating over the map.
   */
  function frameCourse(opts) {
    const o = opts || {};
    const b = new maplibregl.LngLatBounds();
    for (let i = 0; i < flat.length; i += 8) b.extend(flat[i]);
    b.extend(flat[flat.length - 1]);
    map.fitBounds(b, {
      padding: framePadding(),
      pitch: o.pitch == null ? OVERVIEW_PITCH : o.pitch,
      duration: o.animate ? FLIGHT_MS : 0,
    });
  }

  /**
   * Tapping a station centres it. Deliberately no camera offset: on a pitched
   * terrain map a flyTo `offset` shifts the target toward the horizon and the
   * scene stops rendering altogether — measured at a cue near Sheep Gulch, an
   * offset of -179 px drew a completely black map where the same camera with no
   * offset drew the course and six turn badges. `padding` keeps the course but
   * stops symbols being placed. So the card is sized to clear the middle of the
   * map instead, which costs nothing and cannot break the render.
   */
  function focusStation(id, zoom) {
    const st = (aid.stations || []).find((s) => s.id === id);
    if (!st) return;
    map.flyTo({
      center: st.coord,
      zoom: zoom || DETAIL_ZOOM,
      pitch: DETAIL_PITCH,
      duration: FLIGHT_MS,
      essential: true,
    });
    setCursorMile(st.outboundTrackMile != null ? st.outboundTrackMile : st.inboundTrackMile);
  }

  /** The unsupported stretch runs from the Dam to the finish; frame just those. */
  function focusGap() {
    const b = new maplibregl.LngLatBounds();
    sliceCoordsByMile(flat, trackMiles, gapFromTrack, gapToTrack).forEach((c) => b.extend(c));
    map.fitBounds(b, { padding: framePadding(), duration: FLIGHT_MS, pitch: OVERVIEW_PITCH });
    setCursorMile((gapFromTrack + gapToTrack) / 2);
  }

  /**
   * Padding that keeps the course clear of the page chrome, which floats over
   * the map on every side: the layer buttons top-left, MapLibre's zoom stack
   * top-right on desktop, and the gap callout across the bottom. Without the
   * extra clearance Winfield hides behind the callout and Start / Finish
   * disappears under the zoom buttons.
   */
  function framePadding() {
    const w = map.getContainer().clientWidth;
    const pad = w < 520 ? 26 : 48;
    return {
      top: pad + CTRL_CLEARANCE_PX,
      bottom: pad + GAP_FLAG_CLEARANCE_PX,
      left: pad,
      right: pad + (w < DESKTOP_MIN_PX ? 8 : ZOOM_CTRL_CLEARANCE_PX),
    };
  }

  function setGhost(on) {
    ghostOn = !!on;
    if (map.getLayer(GHOST_LAYER)) {
      map.setLayoutProperty(GHOST_LAYER, 'visibility', ghostOn ? 'visible' : 'none');
    }
    return ghostOn;
  }

  addGhost();
  addGap();
  addTurns();
  addStations();
  addCursor();

  return {
    map,
    coords: flat,
    rows: stopRows(aid),
    stations: aid.stations || [],
    turns: turnData,
    series,
    totalMiles,
    gap: { fromMile: gapFromTrack, toMile: gapToTrack, published: advisories.gap },
    setCursorMile,
    getCursorMile: () => cursorMile,
    elevationAt: (mile) => elevationAtMile(series, mile),
    pointAt: (mile) => pointAtMile(flat, trackMiles, mile),
    setGhost,
    isGhostOn: () => ghostOn,
    focusTurn,
    setActiveTurn,
    getActiveTurn: () => activeTurnId,
    frameCourse,
    focusStation,
    focusGap,
    on(name, fn) {
      if (listeners[name]) listeners[name].push(fn);
      return this;
    },
  };
}

/** Flatten any course GeoJSON shape into one ordered [lon, lat] list. */
function flattenCourseCoords(course) {
  const out = [];
  const push = (geom) => {
    if (!geom) return;
    if (geom.type === 'LineString') geom.coordinates.forEach((c) => out.push([c[0], c[1]]));
    else if (geom.type === 'MultiLineString') {
      geom.coordinates.forEach((line) => line.forEach((c) => out.push([c[0], c[1]])));
    }
  };
  if (course.type === 'FeatureCollection') course.features.forEach((f) => push(f.geometry));
  else if (course.type === 'Feature') push(course.geometry);
  else push(course);
  return out;
}

/**
 * The elevation profile: a canvas chart the whole width of the page, scrubable
 * by pointer or keyboard. Drawn at devicePixelRatio so it stays sharp on a
 * phone, and redrawn on resize.
 *
 * @param {Object} o
 * @param {HTMLCanvasElement} o.canvas
 * @param {Array}  o.series   [{distanceMi, elevationFt}]
 * @param {Array}  o.rows     stop rows (ticks)
 * @param {Object} o.gap      {fromMile, toMile}
 * @param {Function} o.onScrub called with a mile while dragging
 */
function createProfileChart(o) {
  const canvas = o.canvas;
  const ctx = canvas.getContext('2d');
  const series = o.series || [];
  const rows = o.rows || [];
  const gap = o.gap;
  const onScrub = o.onScrub || (() => {});
  const totalMiles = series.length ? series[series.length - 1].distanceMi : 0;

  const PAD = { top: 12, right: 10, bottom: 18, left: 34 };
  let cursor = 0;
  let width = 0;
  let height = 0;

  const lo = series.reduce((a, p) => Math.min(a, p.elevationFt), Infinity);
  const hi = series.reduce((a, p) => Math.max(a, p.elevationFt), -Infinity);
  const yLo = Math.floor((lo - 150) / 500) * 500;
  const yHi = Math.ceil((hi + 150) / 500) * 500;

  const xOf = (mi) => PAD.left + (mi / totalMiles) * (width - PAD.left - PAD.right);
  const yOf = (ft) => PAD.top + (1 - (ft - yLo) / (yHi - yLo)) * (height - PAD.top - PAD.bottom);
  const mileOf = (px) =>
    clamp(((px - PAD.left) / (width - PAD.left - PAD.right)) * totalMiles, 0, totalMiles);

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    if (!width || !height) return;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw() {
    if (!width || !height || !series.length) return;
    ctx.clearRect(0, 0, width, height);

    // y grid + labels, every 1000 ft. 11px is the page's type floor — the
    // profile is read in a headlamp, so it holds here too.
    ctx.font = '11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textBaseline = 'middle';
    for (let ft = yLo; ft <= yHi; ft += 1000) {
      const y = yOf(ft);
      ctx.strokeStyle = 'rgba(242,239,231,0.10)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(PAD.left, y);
      ctx.lineTo(width - PAD.right, y);
      ctx.stroke();
      ctx.fillStyle = 'rgba(242,239,231,0.42)';
      ctx.textAlign = 'right';
      ctx.fillText((ft / 1000).toFixed(0) + 'k', PAD.left - 6, y);
    }

    // the unsupported stretch, shaded behind the terrain fill
    if (gap) {
      ctx.fillStyle = 'rgba(201,162,39,0.16)';
      ctx.fillRect(xOf(gap.fromMile), PAD.top, xOf(gap.toMile) - xOf(gap.fromMile),
        height - PAD.top - PAD.bottom);
      ctx.strokeStyle = 'rgba(201,162,39,0.55)';
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(xOf(gap.fromMile), PAD.top);
      ctx.lineTo(xOf(gap.fromMile), height - PAD.bottom);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // terrain fill + ridge
    ctx.beginPath();
    ctx.moveTo(xOf(0), height - PAD.bottom);
    series.forEach((p) => ctx.lineTo(xOf(p.distanceMi), yOf(p.elevationFt)));
    ctx.lineTo(xOf(totalMiles), height - PAD.bottom);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, PAD.top, 0, height - PAD.bottom);
    grad.addColorStop(0, 'rgba(242,239,231,0.26)');
    grad.addColorStop(1, 'rgba(242,239,231,0.04)');
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    series.forEach((p, i) => {
      const x = xOf(p.distanceMi);
      const y = yOf(p.elevationFt);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = '#EDE7DA';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // stop ticks — aid stops solid, crew-only hollow
    rows.forEach((r) => {
      const x = xOf(r.trackMile);
      const y = yOf(elevationAtMile(series, r.trackMile));
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      if (r.aid) {
        ctx.fillStyle = '#C9A227';
        ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(199,200,202,0.85)';
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }
    });

    // x labels
    ctx.fillStyle = 'rgba(242,239,231,0.42)';
    ctx.textAlign = 'center';
    [0, 25, 50, 75, 100].forEach((mi) => {
      const m = Math.min(mi, totalMiles);
      ctx.fillText(String(mi), xOf(m), height - PAD.bottom + 9);
    });

    // cursor
    const cx = xOf(cursor);
    ctx.strokeStyle = 'rgba(242,239,231,0.85)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, PAD.top - 4);
    ctx.lineTo(cx, height - PAD.bottom);
    ctx.stroke();
    const cy = yOf(elevationAtMile(series, cursor));
    ctx.beginPath();
    ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = '#F2EFE7';
    ctx.fill();
    ctx.strokeStyle = '#0E0E0D';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function setCursor(mile) {
    cursor = clamp(mile, 0, totalMiles);
    draw();
  }

  // ---- interaction ------------------------------------------------------- //
  let dragging = false;

  function scrubFrom(clientX) {
    const rect = canvas.getBoundingClientRect();
    const mile = mileOf(clientX - rect.left);
    setCursor(mile);
    onScrub(mile);
  }

  canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    canvas.setPointerCapture(e.pointerId);
    scrubFrom(e.clientX);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (dragging) scrubFrom(e.clientX);
  });
  const stop = (e) => {
    if (!dragging) return;
    dragging = false;
    if (e.pointerId != null && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
  };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);

  canvas.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 5 : 1;
    if (e.key === 'ArrowRight') setCursorAndEmit(cursor + step);
    else if (e.key === 'ArrowLeft') setCursorAndEmit(cursor - step);
    else if (e.key === 'Home') setCursorAndEmit(0);
    else if (e.key === 'End') setCursorAndEmit(totalMiles);
    else return;
    e.preventDefault();
  });

  function setCursorAndEmit(mile) {
    setCursor(mile);
    onScrub(clamp(mile, 0, totalMiles));
  }

  window.addEventListener('resize', resize);
  resize();

  return { draw, resize, setCursor, totalMiles };
}
