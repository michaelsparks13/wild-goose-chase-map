"},"contradictions":{"title":"Conflicting official information","lede":"The official race page states four things twice, differently. Both values are printed below with the tab each came from. We have not picked one — verify at the mandatory athlete meeting, 10:00 am Friday.","items":[{"id":"outbound-noon-cutoff","question":"Which station holds the 12:15 pm outbound cutoff?","a":{"value":"Pipeline","tab":"2026 Race Week Rundown → Saturday, August 22nd","quote":"12:15pm | Pipeline"},"b":{"value":"Half Pipe","tab":"Course → Aid Stations & Course Cutoffs","quote":"12:15pm | Half Pipe"},"why":"These are 2.2 miles apart — Pipeline 29.6, Half Pipe 31.8 — and the Crew tab says Pipeline is not an aid station at all."},{"id":"inbound-2am-cutoff","question":"Which station holds the 2:00 am Sunday inbound cutoff?","a":{"value":"“Half Pipeline”","tab":"Course → Aid Stations & Course Cutoffs","quote":"2:00am Sunday | Half Pipeline"},"b":{"value":"Half Pipe","tab":"2026 Race Week Rundown → Sunday, August 23rd","quote":"2:00am | Half Pipe"},"why":"There is no stop called Half Pipeline on the 2026 course. Half Pipe inbound is 72.8; Pipeline inbound is 75.1."},{"id":"pacer-start-mile","question":"At what mile may a pacer join?","a":{"value":"Mile 61.8","tab":"Pacer Information (stated twice)","quote":"Pacers are allowed starting at mile 61.8, Twin Lakes Village inbound"},"b":{"value":"Mile 64.2","tab":"Course → Aid Stations & Course Cutoffs; Crew Information agrees","quote":"Twin Lakes Village – inbound (mile 64.2)"},"why":"61.8 is the classic-course figure carried over. The station is the same; the mileage is 2.4 miles stale."},{"id":"course-description","question":"Does the course still climb Powerline and Sugarloaf?","a":{"value":"Yes — “over 15,000 feet”","tab":"Course → course description","quote":"The course includes steep climbs of Powerline, high-altitude passes like Sugarloaf … all amounting to over 15,000 feet of elevation gain."},"b":{"value":"No — 13,552 ft","tab":"Course → the 2026 revised route + The Details","quote":"The following areas were impacted by the Willow Fire and will not be featured: Hagerman Pass Road, Sugarloaf Mountain, Powerline. … Elevation Gain: 13,552’"},"why":"The same tab both promises and removes the same three features. The 2026 course does not go near any of them."}]},"measurement":{"title":"Our measurement vs their published figure","body":"Distance checks out: we measure 99.86 miles on the official Ride With GPS route against LRS's published 100. Elevation gain does not. Measuring the official 2026 GPX with a 3-metre confirmed-move filter gives 14,992 ft, not the published 13,552 — 10.6% apart. The same filter on the classic GPX returns 15,476 ft against LRS's published 15,492, a difference of 0.11%, so the method is not the problem. Plan on more climbing than the page advertises.","rows":[{"label":"2026 distance","computed":"99.86 mi","published":"100 mi","delta":"−0.14%","ok":true},{"label":"2026 gain","computed":"14,992 ft","published":"13,552 ft","delta":"+10.63%","ok":false},{"label":"Classic distance","computed":"99.54 mi","published":"99.7 mi","delta":"−0.16%","ok":true},{"label":"Classic gain","computed":"15,476 ft","published":"15,492 ft","delta":"−0.11%","ok":true}]},"changed":{"title":"What changed for 2026","lede":"The Willow Fire closed Hagerman Pass Road, Sugarloaf Mountain and Powerline. The course now runs west from Harrison Ave, around Turquoise Lake, and back east around the lake before rejoining the traditional route into Outward Bound.","rows":[{"label":"Distance","from":"99.7 mi","to":"100 mi"},{"label":"Published gain","from":"15,492 ft","to":"13,552 ft"},{"label":"Aid station stops","from":"11","to":"12"},{"label":"Crew locations","from":"4","to":"3"},{"label":"Last carry to the finish","from":"12.5 mi","to":"15.8 mi"}],"gone":["Hagerman Pass Road","Sugarloaf Mountain","Powerline","Mayqueen aid station"],"arrived":["Carter Summit (outbound only)","Turquoise Lake Dam","The Turquoise Lake loop"]},"crewRules":{"title":"Rules that disqualify","items":["Crewing anywhere other than Outward Bound, Pipeline Alternate or Twin Lakes Village disqualifies your runner.","Twin Lakes Village has no driving access. Crews must take the shuttle from Outward Bound — it runs 6:00 am to 11:00 pm.","Crew wristbands are required at Twin Lakes Village (kids 10 and under exempt).","No tents, chairs or coolers in the Twin Lakes open crewing area — bring only what fits in your lap on the shuttle.","Leadville and Twin Lakes are under a Stage 2 fire ban. No fires anywhere in the county or on course.","Pacer bibs are not issued at Pipeline. Pick them up at Twin Lakes Village, Outward Bound or Turquoise Lake Dam."]},"buckles":[{"label":"Big buckle","value":"sub 25:00 — 5:00 am Sunday"},{"label":"Small buckle & official finish","value":"sub 30:00 — 10:00 am Sunday"},{"label":"Start","value":"4:00 am Saturday, 6th & Harrison"}]},"GHOST":{"type":"FeatureCollection","features":[{"type":"Feature","properties":{"name":"Classic Leadville Trail 100 Run course","source":"plotaroute.com/route/2176672","distanceMiles":99.54,"publishedMiles":99.7},"geometry":{"type":"LineString","coordinates":[[-106.29274,39.24849],[-106.29351,39.24837],[-106.29508,39.24803],[-106.29897,39.24717],[-106.30015,39.24692],[-106.3025,39.24642],[-106.30367,39.24616],[-106.30674,39.24543],[-106.30693,39.24529],[-106.30694,39.24394],[-106.30708,39.24369],[-106.30751,39.24331],[-106.30782,39.24275],[-106.30807,39.24265],[-106.30945,39.24261],[-106.31083,39.24256],[-106.31249,39.24242],[-106.31399,39.24234],[-106.31463,39.24224],[-106.31561,39.24225],[-106.31719,39.24218],[-106.31843,39.24206],[-106.31966,39.24193],[-106.32055,39.24184],[-106.32302,39.24217],[-106.32417,39.24228],[-106.32543,39.24219],[-106.32687,39.24204],[-106.32876,39.24207],[-106.32978,39.24189],[-106.33088,39.24154],[-106.33197,39.24117],[-106.33319,39.24077],[-106.33441,39.24035],[-106.33496,39.2402],[-106.33727,39.23996],[-106.33849,39.2     var SOFT_MS = 6000, HARD_MS = 15000;
    var ready = false;

    var loadingEl = document.getElementById('loading');
    var loadingText = document.getElementById('loading-text');
    var overlay = document.getElementById('error-overlay');
    var errorMsg = document.getElementById('error-message');

    function showError(msg) {
      if (ready) return;
      errorMsg.textContent = String(msg || 'Unknown error');
      overlay.classList.add('show');
      if (loadingEl) loadingEl.classList.add('hidden');
    }
    window.addEventListener('error', function (e) {
      showError((e.error && e.error.message) || e.message || 'Script error');
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason; showError((r && r.message) || String(r));
    });

    var softT = setTimeout(function () {
      if (!ready) loadingText.textContent = 'Still loading terrain tiles…';
    }, SOFT_MS);
    var hardT = setTimeout(function () {
      showError('Timed out before the map finished loading. Check your connection and reload.');
    }, HARD_MS);
    function settle() { clearTimeout(softT); clearTimeout(hardT); }

    function hasWebGL() {
      try {
        var c = document.createElement('canvas');
        return !!(c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl'));
      } catch (err) { return false; }
    }
    if (!hasWebGL()) { settle(); showError('WebGL is not available in this browser.'); return; }
    if (!window.maplibregl) { settle(); showError('MapLibre GL JS failed to load from the CDN.'); return; }
    if (!window.FSS || !FSS.createRaceMap || !FSS.createCrewConsole) {
      settle(); showError('The map shell failed to initialize.'); return;
    }

    // ---- tiny DOM helpers (no innerHTML anywhere on this page) ----
    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }
    function add(parent) {
      for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
      return parent;
    }
    function mi(v) { return (Math.round(v * 10) / 10).toFixed(1); }
    function ft(v) { return v == null ? '—' : Math.round(v).toLocaleString() + ' ft'; }

    var ADV = DATA.ADVISORIES;
    var sheet = document.getElementById('sheet');
    var sheetTitle = document.getElementById('sheet-title');
    var sheetBody = document.getElementById('sheet-body');
    var tabsEl = document.getElementById('tabs');
    var openTab = null;
    var console_ = null;
    var chart = null;

    // ---- sheet ----
    function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

    function openSheet(title, build, tab) {
      sheetTitle.textContent = title;
      clear(sheetBody);
      build(sheetBody);
      sheetBody.scrollTop = 0;
      sheet.hidden = false;
      openTab = tab || null;
      syncTabs();
    }
    function closeSheet() { sheet.hidden = true; openTab = null; syncTabs(); }
    function syncTabs() {
      var btns = tabsEl.querySelectorAll('.cc-tab');
      for (var i = 0; i < btns.length; i++) {
        var on = btns[i].getAttribute('data-tab') === openTab;
        btns[i].classList.toggle('is-on', on);
        btns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
      }
    }
    document.getElementById('sheet-close').addEventListener('click', closeSheet);

    // ---- aid list ----
    function legTag(leg) {
      var t = el('span', 'cc-leg' + (leg === 'inbound' ? ' cc-leg--in' : ''), leg === 'inbound' ? 'In' : 'Out');
      return t;
    }

    function buildAidList(root) {
      console_.rows.forEach(function (r) {
        var row = el('button', 'cc-row' + (r.aid ? '' : ' cc-row--crew'));
        row.type = 'button';
        add(row, el('span', 'cc-row-mile', mi(r.publishedMile)));
        var main = el('div', 'cc-row-main');
        var name = el('div', 'cc-row-name');
        add(name, legTag(r.leg), document.createTextNode(r.name));
        var subText = r.aid ? (r.note || 'Aid station') : 'Crew only — no aid station';
        add(main, name, el('div', 'cc-row-sub', subText));
        add(row, main);
        var cut = el('div', 'cc-row-cut');
        if (r.cutoff) {
          add(cut, document.createTextNode(r.cutoff), el('span', null, 'cutoff'));
        } else {
          add(cut, el('span', null, 'no cutoff'));
        }
        add(row, cut);
        row.addEventListener('click', function () { showStation(r.stationId); });
        root.appendChild(row);
      });
      var foot = el('p', 'cc-foot',
        'Twelve aid-station stops plus the two crew-only Pipeline stops. Mileages as published by LRS; '
        + 'markers are placed on the official GPX.');
      root.appendChild(foot);
    }

    // ---- station card ----
    function accessRow(label, yes, yesText, noText) {
      var r = el('div', 'cc-acc ' + (yes ? 'cc-acc--yes' : 'cc-acc--no'));
      add(r, el('span', 'cc-acc-mark', yes ? '\u2713' : '\u2717'), el('span', null, label),
        el('span', 'cc-acc-val', yes ? (yesText || 'Yes') : (noText || 'No')));
      return r;
    }

    function legBox(label, mile, cutoff) {
      var b = el('div', 'cc-leg-box');
      add(b, el('div', 'k', label), el('div', 'v', mile == null ? '—' : mi(mile)));
      var c = el('div', 'c');
      if (cutoff) c.textContent = cutoff;
      else add(c, el('em', null, mile == null ? 'no stop this leg' : 'no published cutoff'));
      add(b, c);
      return b;
    }

    function showStation(id) {
      var st = null;
      console_.stations.forEach(function (s) { if (s.id === id) st = s; });
      if (!st) return;
      console_.focusStation(id);
      openSheet('Aid station', function (root) {
        var card = el('div', 'cc-card');
        add(card, el('h3', null, st.name), el('p', 'cc-note', st.note));
        var legs = el('div', 'cc-legs');
        add(legs, legBox('Outbound mile', st.outboundMile, st.outboundCutoff),
          legBox('Inbound mile', st.inboundMile, st.inboundCutoff));
        add(card, legs);
        var acc = el('div', 'cc-access');
        add(acc,
          accessRow('Crew access', st.crew, st.id === 'twin-lakes' ? 'Shuttle only' : 'Yes'),
          accessRow('Drop bag', st.dropBag),
          accessRow('Pacer bib pickup', st.pacerBib));
        add(card, acc);
        if (st.detail) add(card, el('p', 'cc-detail', st.detail));
        if (st.elevationFt) add(card, el('p', 'cc-detail', 'Elevation ' + ft(st.elevationFt) + '.'));
        root.appendChild(card);
        if (st.conflict) {
          var warn = el('div', 'cc-block');
          add(warn, el('p', 'cc-lede',
            'This stop is affected by one of the contradictions on the official page.'));
          var b = el('button', 'cc-mbtn');
          b.type = 'button';
          b.textContent = 'See the conflict';
          b.addEventListener('click', function () { showConflicts(); });
          add(warn, b);
          root.appendChild(warn);
        }
      });
    }

    // ---- turn-by-turn ----
    var TURN_PATHS = {
      straight: 'M12 19V6M12 4l5 6H7z',
      'slight-right': 'M9 19V11.5L14.6 6M17.5 4.2l.6 7.2-6.4-3.2z',
      right: 'M6 19v-5a3 3 0 0 1 3-3h7M20 11l-6 4.5v-9z',
      'sharp-right': 'M7 19V12a3 3 0 0 1 3-3h5M19.5 12.5l-7 3.2 1.8-7z',
      'slight-left': 'M15 19V11.5L9.4 6M6.5 4.2l-.6 7.2 6.4-3.2z',
      left: 'M18 19v-5a3 3 0 0 0-3-3H8M4 11l6 4.5v-9z',
      'sharp-left': 'M17 19V12a3 3 0 0 0-3-3H9M4.5 12.5l7 3.2-1.8-7z',
      uturn: 'M8 20V11a4 4 0 0 1 8 0v4M19 14l-3 4-3-4z'
    };

    function turnArrow(kind) {
      var NS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'cc-arrow');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('aria-hidden', 'true');
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('d', TURN_PATHS[kind] || TURN_PATHS.straight);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', 'currentColor');
      path.setAttribute('stroke-width', '2.1');
      path.setAttribute('stroke-linecap', 'round');
      path.setAttribute('stroke-linejoin', 'round');
      svg.appendChild(path);
      return svg;
    }

    /**
     * The cue sheet and the aid stops merged into one list in course order.
     * A turn on its own tells you to go left; a turn read against "Half Pipe in
     * 1.2 miles" tells you where you are.
     */
    function cueList(leg) {
      var rows = [];
      console_.turns.forEach(function (t) {
        if (t.leg === leg) rows.push({ kind: 'turn', mile: t.mile, turn: t });
      });
      console_.rows.forEach(function (r) {
        if (r.leg === leg) rows.push({ kind: 'stop', mile: r.trackMile, stop: r });
      });
      rows.sort(function (a, b) { return a.mile - b.mile; });
      return rows;
    }

    var turnLeg = 'outbound';

    function buildTurns(root) {
      var filter = el('div', 'cc-legs-filter');
      [['outbound', 'Outbound'], ['inbound', 'Inbound']].forEach(function (pair) {
        var b = el('button', 'cc-chip', pair[1]);
        b.type = 'button';
        b.setAttribute('aria-pressed', turnLeg === pair[0] ? 'true' : 'false');
        b.addEventListener('click', function () {
          turnLeg = pair[0];
          openSheet('Turn by turn', buildTurns, 'turns');
        });
        add(filter, b);
      });
      root.appendChild(filter);

      var list = el('div');
      cueList(turnLeg).forEach(function (row) {
        var node;
        if (row.kind === 'stop') {
          node = el('button', 'cc-cue cc-cue--aid' + (row.stop.aid ? '' : ' cc-cue--crew'));
          node.type = 'button';
          var dot = el('span', 'cc-cue-dot');
          add(dot, el('i'));
          var txt = el('div', 'cc-cue-text', row.stop.name);
          add(txt, el('div', 'cc-cue-street',
            row.stop.aid ? (row.stop.cutoff ? 'Aid station · cutoff ' + row.stop.cutoff : 'Aid station')
                         : 'Crew only — no aid station'));
          add(node, el('span', 'cc-cue-mile', mi(row.stop.publishedMile)), dot, txt);
          node.addEventListener('click', function () { showStation(row.stop.stationId); });
        } else {
          node = el('button', 'cc-cue');
          node.type = 'button';
          node.setAttribute('data-turn', row.turn.id);
          if (console_.getActiveTurn() === row.turn.id) node.classList.add('is-active');
          var body = el('div', 'cc-cue-text', row.turn.text);
          // RWGPS repeats the street inside the instruction ("Turn right onto
          // Clear Creek Road"), so the sub-line only earns its space when the
          // cue is bare — "Turn left", "Keep right" — and the name is news.
          if (row.turn.street && row.turn.text.indexOf(row.turn.street) === -1) {
            add(body, el('div', 'cc-cue-street', 'onto ' + row.turn.street));
          }
          add(node, el('span', 'cc-cue-mile', mi(row.turn.mile)), turnArrow(row.turn.kind), body);
          node.addEventListener('click', function () {
            console_.focusTurn(row.turn.id);
            markActiveTurn(row.turn.id);
          });
        }
        list.appendChild(node);
      });
      root.appendChild(list);
      root.appendChild(el('p', 'cc-foot',
        console_.turns.length + ' cues from the official Ride With GPS route, placed on the '
        + 'course by vertex. Aid stops are merged in at their published mileages. '
        + 'Badges appear on the map once you zoom in.'));
    }

    function markActiveTurn(id) {
      var nodes = sheetBody.querySelectorAll('[data-turn]');
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].classList.toggle('is-active', nodes[i].getAttribute('data-turn') === id);
      }
    }

    /** A badge tapped on the map opens the list at that cue. */
    function showTurn(id) {
      var t = null;
      console_.turns.forEach(function (x) { if (x.id === id) t = x; });
      if (!t) return;
      turnLeg = t.leg;
      console_.setActiveTurn(id);
      openSheet('Turn by turn', buildTurns, 'turns');
      markActiveTurn(id);
      var node = sheetBody.querySelector('[data-turn="' + id + '"]');
      if (node) node.scrollIntoView({ block: 'center' });
    }

    // ---- the gap ----
    function showGap() {
      console_.focusGap();
      var g = ADV.gap;
      openSheet(g.title, function (root) {
        var b = el('div', 'cc-block');
        var hero = el('div', 'cc-hero');
        add(hero, el('span', 'cc-hero-num', String(g.miles)), el('span', 'cc-hero-unit', 'miles'),
          el('span', 'cc-hero-sub', 'with no aid of any kind'));
        add(b, hero);
        var span = el('div', 'cc-span');
        add(span, el('b', null, g.fromLabel + ' \u00b7 ' + g.fromMile), el('span', 'cc-span-rule'),
          el('b', null, g.toLabel + ' \u00b7 ' + g.toMile));
        add(b, span);
        add(b, el('p', 'cc-lede', g.summary));
        add(b, el('p', 'cc-body', g.body));
        add(b, el('p', 'cc-lede', g.cutoffNote));
        root.appendChild(b);

        var c = el('div', 'cc-block');
        add(c, el('p', 'cc-lede', 'The classic course carried ' + g.classicMiles
          + ' miles from Mayqueen inbound to the finish. 2026 adds '
          + (Math.round((g.miles - g.classicMiles) * 10) / 10) + ' miles to that last carry.'));
        root.appendChild(c);
      }, 'gap');
    }

    // ---- conflicts ----
    function showConflicts() {
      var C = ADV.contradictions;
      openSheet(C.title, function (root) {
        var head = el('div', 'cc-block');
        add(head, el('p', 'cc-lede', C.lede));
        root.appendChild(head);

        var list = el('div', 'cc-block');
        C.items.forEach(function (item) {
          var box = el('div', 'cc-conflict');
          add(box, el('h4', null, item.question));
          var vs = el('div', 'cc-vs');
          [item.a, item.b].forEach(function (side, i) {
            if (i === 1) add(vs, el('div', 'cc-vs-or', 'versus'));
            var s = el('div', 'cc-vs-side');
            add(s, el('div', 'val', side.value), el('div', 'tab', side.tab),
              el('div', 'quote', '\u201C' + side.quote + '\u201D'));
            add(vs, s);
          });
          add(box, vs, el('p', 'cc-why', item.why));
          list.appendChild(box);
        });
        root.appendChild(list);

        var m = ADV.measurement;
        var mb = el('div', 'cc-block');
        add(mb, el('h4', null, m.title), el('p', 'cc-lede', m.body));
        var table = el('table', 'cc-table');
        var thead = el('thead');
        var htr = el('tr');
        ['', 'Ours', 'Theirs', 'Delta'].forEach(function (h) { add(htr, el('th', null, h)); });
        add(thead, htr);
        var tbody = el('tbody');
        m.rows.forEach(function (row) {
          var tr = el('tr');
          add(tr, el('td', null, row.label), el('td', 'num', row.computed),
            el('td', 'num', row.published),
            el('td', 'num' + (row.ok ? '' : ' delta-bad'), row.delta));
          add(tbody, tr);
        });
        add(table, thead, tbody);
        add(mb, table);
        root.appendChild(mb);

        var a = document.createElement('a');
        a.className = 'cc-src';
        a.href = ADV.source.official;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        add(a, el('b', null, 'Check the official page \u2192'), document.createElement('br'),
          document.createTextNode(ADV.source.official));
        root.appendChild(a);
        root.appendChild(el('p', 'cc-foot',
          'Captured ' + ADV.source.capturedAt + '. LRS may have corrected these since. '
          + 'Verify at the mandatory athlete meeting, 10:00 am Friday.'));
      }, 'conflicts');
    }

    // ---- what changed ----
    function showChanged() {
      var ch = ADV.changed;
      openSheet(ch.title, function (root) {
        var b = el('div', 'cc-block');
        add(b, el('p', 'cc-lede', ch.lede));
        var table = el('table', 'cc-table');
        var tbody = el('tbody');
        ch.rows.forEach(function (row) {
          var tr = el('tr');
          var td = el('td', 'num');
          add(td, el('span', 'cc-strike', row.from), el('span', 'cc-arrow', '\u2192'),
            el('b', null, row.to));
          add(tr, el('td', null, row.label), td);
          add(tbody, tr);
        });
        add(table, tbody);
        add(b, table);
        root.appendChild(b);

        var g = el('div', 'cc-block');
        add(g, el('h4', null, 'Gone'));
        var gone = el('div', 'cc-tags');
        ch.gone.forEach(function (t) { add(gone, el('span', 'cc-tag cc-tag--gone', t)); });
        add(g, gone, el('h4', null, 'New'));
        var neu = el('div', 'cc-tags');
        ch.arrived.forEach(function (t) { add(neu, el('span', 'cc-tag cc-tag--new', t)); });
        add(g, neu);
        add(g, el('p', 'cc-lede',
          'Tap "Classic course" on the map to ghost the old route underneath.'));
        root.appendChild(g);

        var r = el('div', 'cc-block');
        add(r, el('h4', null, ADV.crewRules.title));
        var ul = el('ul', 'cc-list');
        ADV.crewRules.items.forEach(function (t) { add(ul, el('li', null, t)); });
        add(r, ul);
        root.appendChild(r);
        root.appendChild(el('p', 'cc-foot',
          'Map by FalseSummitStudio.com \u2014 not an official race document. '
          + 'Course from ' + ADV.source.routeUrl + ', captured ' + ADV.source.capturedAt + '.'));
      }, 'changed');
    }

    tabsEl.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.cc-tab') : null;
      if (!btn) return;
      var tab = btn.getAttribute('data-tab');
      if (openTab === tab) { closeSheet(); return; }
      if (tab === 'aid') openSheet('Aid stations', buildAidList, 'aid');
      else if (tab === 'turns') openSheet('Turn by turn', buildTurns, 'turns');
      else if (tab === 'gap') showGap();
      else if (tab === 'conflicts') showConflicts();
      else if (tab === 'changed') showChanged();
    });

    // ---- readout ----
    function updateReadout(mile) {
      document.getElementById('ro-mile').textContent = 'Mile ' + mi(mile);
      document.getElementById('ro-elev').textContent = ft(console_.elevationAt(mile));
      var next = null;
      console_.rows.forEach(function (r) {
        if (!next && r.aid && r.trackMile > mile + 0.05) next = r;
      });
      document.getElementById('ro-next').textContent = next
        ? 'Next aid: ' + next.name + ' \u00b7 ' + mi(next.publishedMile)
        : 'No aid ahead \u2014 ' + mi(console_.totalMiles - mile) + ' mi to the finish';
      var canvas = document.getElementById('profile');
      canvas.setAttribute('aria-valuenow', String(Math.round(mile * 10) / 10));
      canvas.setAttribute('aria-valuetext', 'Mile ' + mi(mile) + ', ' + ft(console_.elevationAt(mile)));
    }

    // ---- boot ----
    FSS.createRaceMap({
      container: 'map',
      config: DATA.RACE,
      course: DATA.COURSE,
      profile: DATA.PROFILE,
      revealProgress: 1,
      onReady: function (handle) {
        ready = true; settle();
        loadingEl.classList.add('hidden');

        console_ = FSS.createCrewConsole({
          handle: handle, aid: DATA.AID, advisories: DATA.ADVISORIES,
          ghost: DATA.GHOST, turns: DATA.TURNS, profile: DATA.PROFILE
        });
        console_.on('station', showStation);
        console_.on('turn', showTurn);
        console_.frameCourse();

        chart = FSS.createProfileChart({
          canvas: document.getElementById('profile'),
          series: console_.series,
          rows: console_.rows,
          gap: { fromMile: console_.gap.fromMile, toMile: console_.gap.toMile },
          onScrub: function (m) { console_.setCursorMile(m); }
        });
        console_.on('mile', function (m) { chart.setCursor(m); updateReadout(m); });
        console_.setCursorMile(0);

        var g = DATA.ADVISORIES.gap;
        document.getElementById('gap-num').textContent = g.miles + ' mi';
        document.getElementById('gap-txt').textContent = 'from ' + g.fromLabel + ' at '
          + g.fromMile + ' to the finish, with no aid';
        document.getElementById('gap-flag').addEventListener('click', showGap);

        var ghostBtn = document.getElementById('ghost-btn');
        ghostBtn.addEventListener('click', function () {
          var on = console_.setGhost(!console_.isGhostOn());
          ghostBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        document.getElementById('fit-btn').addEventListener('click', function () {
          console_.frameCourse({ animate: true });
        });

        window.addEventListener('resize', function () { chart.resize(); });

        // Verification seam: the gate drives and measures the live map through
        // this. Read-only from the page's point of view — nothing here depends
        // on it existing.
        FSS.crew = console_;
        FSS.map = handle.map;

        // Deterministic readiness signal. Headless rAF timing is unreliable, so
        // the verification gate waits on this attribute rather than a timer.
        document.documentElement.setAttribute('data-cc-ready', '1');
      },
      onError: function (err) { settle(); showError(err && err.message ? err.message : err); }
    }).catch(function () { /* surfaced via onError */ });
  })();
  </script>
</body>
</html>
