[build]
  command = "node build.js"
  publish = "dist"

[[headers]]
  for = "/tiles/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/embed/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
    Access-Control-Allow-Origin = "*"

# /maps/{slug}/ pages support ?embed=1 mode (race directors iframe these
# from their own race sites). Allow framing from any origin.
[[headers]]
  for = "/maps/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"

# AR course preview assets. iOS Quick Look requires the exact USDZ MIME type;
# models never change without a filename-preserving redeploy, so cache hard.
[[headers]]
  for = "/ar/*/course.usdz"
  [headers.values]
    Content-Type = "model/vnd.usdz+zip"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/ar/*/course.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=86400"
