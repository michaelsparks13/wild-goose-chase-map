[build]
  command = "node build.js"
  publish = "dist"

[[headers]]
  for = "/tiles/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/embed/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
    Access-Control-Allow-Origin = "*"

# /maps/{slug}/ pages support ?embed=1 mode (race directors iframe these
# from their own race sites). Allow framing from any origin.
[[headers]]
  for = "/maps/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
